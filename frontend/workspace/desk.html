<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>catOS｜工作台</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/workspace/assets/home.css">
  <link rel="stylesheet" href="/workspace/assets/home-layout.css">
  <script src="/workspace/assets/home-layout.js" defer></script>
  <link rel="stylesheet" href="/workspace/assets/desk.css">
  <script src="/workspace/assets/desk.js" defer></script>
</head>
<body class="desk-page">
  <header class="app-header">
    <a class="brand" href="/workspace/home"><span class="brand-mark">▪</span><span><strong>catOS</strong><small>TRADING WORKSTATION</small></span></a>
    <div class="header-title"><strong id="page-title">工作台</strong><small id="page-en">WORKSTATION</small></div>
    <div class="header-actions"><span class="badge badge-amber">本機合成</span><button id="refresh" class="plain">↻ 更新</button><button data-detail="source" class="plain">資料詳情</button></div>
  </header>
  <div id="live-page" class="app-body">
    <aside class="sidebar" aria-label="主要導航">
      <nav>
        <a href="/workspace/home" class="nav-item"><span class="nav-icon">▦</span><span>戰情總覽<small>DASHBOARD</small></span></a>
        <a href="/workspace/research" class="nav-item"><span class="nav-icon">⌁</span><span>策略中心<small>STRATEGY LAB</small></span></a>
        <a href="/workspace/execution" class="nav-item"><span class="nav-icon">▣</span><span>機器人管理<small>BOTS FLEET</small></span></a>
        <a href="/workspace/risk" class="nav-item"><span class="nav-icon">⬡</span><span>風險控管<small>RISK LATCH</small></span></a>
        <a href="/workspace/events" class="nav-item"><span class="nav-icon">≡</span><span>系統日誌<small>AUDIT LOGS</small></span></a>
        <a href="/workspace/yaozi" class="nav-item"><span class="nav-icon">◎</span><span>市場情報<small>YAOZI INTEL</small></span></a>
        <a href="/workspace/settings" class="nav-item"><span class="nav-icon">⚙</span><span>系統設定<small>CONFIGURATION</small></span></a>
      </nav>
      <button class="sidebar-telemetry" data-detail="source"><span>DATA CONNECTION <b id="connection-label">讀取中</b></span><small>研究服務 <i id="research-connection">—</i> · R4 <i id="runtime-connection">—</i></small></button>
      <div class="sidebar-footer"><span class="dot"></span> LOCAL SIM <span class="mono">127.0.0.1</span></div>
    </aside>
    <main class="main">
      <div class="workspace-toolbar-bar" id="workspace-toolbar-bar">
        <div class="workspace-presets-group"><span class="eyebrow">LAYOUT //</span>
          <button class="workspace-preset-pill active" data-preset="executive"><span class="dot"></span>標準版面</button>
          <button class="workspace-preset-pill" data-preset="research"><span class="dot cyan"></span>主面板優先</button>
          <button class="workspace-preset-pill" data-preset="sentinel"><span class="dot amber"></span>雙欄檢視</button>
        </div>
        <div class="workspace-actions-group">
          <button class="btn btn-sm btn-ghost" id="btn-workspace-edit-toggle" data-layout="edit" aria-pressed="false">⚙ 調整版面</button>
          <button class="btn-autopack" id="btn-workspace-autopack" data-layout="pack">ϟ 自動補滿</button>
          <button class="btn btn-sm btn-ghost" data-layout="undo">↶ 復原</button>
          <button class="btn btn-sm btn-ghost" data-layout="reset">⟲ 重設</button>
          <button class="btn btn-sm btn-ghost" data-layout="library">＋ 元件</button>
        </div>
      </div>
      <div class="page-controls" id="page-controls"></div>
      <div class="monitor-line"><span id="monitor-status" role="status">資料讀取中</span><span id="monitor-time" class="mono">—</span><button data-detail="monitor" class="plain">詳情 ↗</button></div>
      <div class="tiling-workspace-container" id="dashboard-tiling-workspace">
        <section class="tiling-top-panel" id="widget-kpi_grid" data-widget-id="kpi_grid"><div class="grid-stack-item-content"><div class="widget-box-header"><div class="widget-title-wrap"><span class="th-dual-zh" id="title-kpi_grid"></span><span class="th-dual-en" id="en-kpi_grid"></span></div><div class="pane-actions"><button class="btn-pane-maximize" data-widget="kpi_grid" aria-label="放大面板">↗</button></div></div><div class="widget-box-body" id="body-kpi_grid"><div class="empty">讀取中</div></div></div></section>
        <div class="workspace-splitter horizontal" id="splitter-h-top" data-top="widget-kpi_grid" data-bottom="tiling-main-area" title="調整摘要高度；雙擊還原"></div>
        <div class="tiling-main-area" id="tiling-main-area">
          <div class="tiling-row-tier" id="tiling-upper-tier"><section class="tiling-pane" id="widget-equity_chart" data-widget-id="equity_chart"><div class="tiling-pane-content panel-specular"><div class="widget-box-header"><div class="widget-title-wrap"><span class="th-dual-zh" id="title-equity_chart"></span><span class="th-dual-en" id="en-equity_chart"></span></div><div class="pane-actions"><button class="btn-pane-maximize" data-widget="equity_chart" aria-label="放大面板">↗</button><button class="widget-btn-hide" data-hide="equity_chart" aria-label="隱藏面板">×</button></div></div><div class="widget-box-body" id="body-equity_chart"><div class="empty">讀取中</div></div></div></section><section class="tiling-pane" id="widget-incident_timeline" data-widget-id="incident_timeline"><div class="tiling-pane-content panel-specular"><div class="widget-box-header"><div class="widget-title-wrap"><span class="th-dual-zh" id="title-incident_timeline"></span><span class="th-dual-en" id="en-incident_timeline"></span></div><div class="pane-actions"><button class="btn-pane-maximize" data-widget="incident_timeline" aria-label="放大面板">↗</button><button class="widget-btn-hide" data-hide="incident_timeline" aria-label="隱藏面板">×</button></div></div><div class="widget-box-body" id="body-incident_timeline"><div class="empty">讀取中</div></div></div></section></div>
          <div class="workspace-splitter horizontal" id="splitter-h-main" data-top="tiling-upper-tier" data-bottom="tiling-lower-tier" title="調整上下高度；雙擊還原"></div>
          <div class="tiling-row-tier" id="tiling-lower-tier"><section class="tiling-pane" id="widget-active_bots" data-widget-id="active_bots"><div class="tiling-pane-content panel-specular"><div class="widget-box-header"><div class="widget-title-wrap"><span class="th-dual-zh" id="title-active_bots"></span><span class="th-dual-en" id="en-active_bots"></span></div><div class="pane-actions"><button class="btn-pane-maximize" data-widget="active_bots" aria-label="放大面板">↗</button><button class="widget-btn-hide" data-hide="active_bots" aria-label="隱藏面板">×</button></div></div><div class="widget-box-body" id="body-active_bots"><div class="empty">讀取中</div></div></div></section><section class="tiling-pane" id="widget-research_tasks" data-widget-id="research_tasks"><div class="tiling-pane-content panel-specular"><div class="widget-box-header"><div class="widget-title-wrap"><span class="th-dual-zh" id="title-research_tasks"></span><span class="th-dual-en" id="en-research_tasks"></span></div><div class="pane-actions"><button class="btn-pane-maximize" data-widget="research_tasks" aria-label="放大面板">↗</button><button class="widget-btn-hide" data-hide="research_tasks" aria-label="隱藏面板">×</button></div></div><div class="widget-box-body" id="body-research_tasks"><div class="empty">讀取中</div></div></div></section><section class="tiling-pane" id="widget-yaozi_brief" data-widget-id="yaozi_brief"><div class="tiling-pane-content panel-specular"><div class="widget-box-header"><div class="widget-title-wrap"><span class="th-dual-zh" id="title-yaozi_brief"></span><span class="th-dual-en" id="en-yaozi_brief"></span></div><div class="pane-actions"><button class="btn-pane-maximize" data-widget="yaozi_brief" aria-label="放大面板">↗</button><button class="widget-btn-hide" data-hide="yaozi_brief" aria-label="隱藏面板">×</button></div></div><div class="widget-box-body" id="body-yaozi_brief"><div class="empty">讀取中</div></div></div></section></div>
        </div>
      </div>
    </main>
  </div>
  <div class="widget-library-backdrop" id="widget-library-backdrop"></div>
  <aside class="widget-library-panel" id="widget-library-panel" role="dialog" aria-modal="true" aria-label="元件庫" inert><div class="widget-library-header"><strong>元件庫</strong><button data-layout="close-library" class="plain" aria-label="關閉元件庫">×</button></div><div class="widget-library-body" id="widget-library-body"></div></aside>
  <dialog id="detail-dialog"><header><strong id="detail-title">詳情</strong><button id="detail-close" class="plain" aria-label="關閉詳情">×</button></header><div id="detail-body"></div></dialog>
</body>
</html>
