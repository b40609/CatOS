<!doctype html>
<html lang="zh-Hant" data-theme="light" data-updown="gu" data-density="full">
<head><script>window.__THEME='dark'</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CatOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sans:"Noto Sans TC","Segoe UI","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
  --num:"Source Sans 3","Segoe UI","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:var(--num);
  --shell:#15181c;--shell2:#22262b;--shell-fg:#eef1f3;--shell-dim:#a0a9b2;--shell-line:#2d3238;--gold:#f2b63c;
  --bg:#f1f3f4;--panel:#ffffff;--panel2:#f6f7f8;--line:#dde1e4;--line2:#c3c9ce;--grid:#e8ebed;
  --fg:#14181c;--dim:#4d5760;--faint:#6b757e;
  --pri:#15181c;--pri-fg:#ffffff;--focus:#b07c00;
  --g:#0a7a53;--g-b:#12a06e;--g-s:#e1f3eb;
  --r:#bf3026;--r-b:#d8453a;--r-s:#fbe9e7;
  --warn:#a55204;--warn-b:#e07d18;--warn-s:#fdeedc;
  --you:#8a6100;--you-b:#d99a0b;--you-s:#fbf2d6;--you-l:#ecd28a;
  --info:#2a66cf;--info-s:#e6eefc;
  --ok:var(--g);--ok-b:var(--g-b);--ok-s:var(--g-s);--bad:var(--r);--bad-b:var(--r-b);--bad-s:var(--r-s);
  --up:var(--g);--up-b:var(--g-b);--down:var(--r);--down-b:var(--r-b);
  --sh:0 14px 40px rgba(16,20,24,.18),0 2px 6px rgba(16,20,24,.08);
}
html[data-theme=dark]{
  --shell:#0b0c0d;--shell2:#1b1d1f;--shell-line:#26282b;
  --bg:#121314;--panel:#1a1b1d;--panel2:#212325;--line:#2e3033;--line2:#44484c;--grid:#27292c;
  --fg:#eceeef;--dim:#a9afb4;--faint:#868d93;
  --pri:#f2b63c;--pri-fg:#1a1305;--focus:#f2b63c;
  --g:#3ccf98;--g-b:#2fb985;--g-s:rgba(60,207,152,.13);
  --r:#f4776b;--r-b:#e5564a;--r-s:rgba(244,119,107,.14);
  --warn:#f5a85a;--warn-b:#e88a2a;--warn-s:rgba(245,168,90,.14);
  --you:#f2b63c;--you-b:#f2b63c;--you-s:rgba(242,182,60,.11);--you-l:rgba(242,182,60,.4);
  --info:#7daaf7;--info-s:rgba(125,170,247,.14);
  --sh:0 18px 50px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4);
}
html[data-updown=ru]{--up:var(--r);--up-b:var(--r-b);--down:var(--g);--down-b:var(--g-b)}
*{box-sizing:border-box}
html{background:var(--bg);scrollbar-color:var(--line2) transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
::selection{background:#f2b63c;color:#14181c}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
input,textarea,select{caret-color:var(--focus)}
h1,h2,h3,p{margin:0}
.n{font-family:var(--num);font-variant-numeric:tabular-nums lining-nums;font-size:1.07em}
.dim{color:var(--dim)}.faint{color:var(--faint)}.up{color:var(--up)}.down{color:var(--down)}
.okc{color:var(--ok)}.badc{color:var(--bad)}.warnc{color:var(--warn)}.youc{color:var(--you)}
.s{font-size:12.5px}.xs{font-size:12px}.r{text-align:right}.b{font-weight:700}
.ic{flex:none;vertical-align:-3px}
.row{display:flex;align-items:center;gap:8px}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.g{display:grid;gap:16px}.stack{display:grid;gap:16px;align-content:start}

/* ---- 外框：深色指示牌 ---- */
.app{display:grid;grid-template-columns:212px minmax(0,1fr);min-height:900px}
.rail{background:var(--shell);color:var(--shell-fg);border-right:1px solid var(--shell-line)}
.rail-in{position:sticky;top:0;padding:14px 12px 18px;display:grid;gap:2px}
.logo{display:flex;align-items:center;gap:10px;height:40px;padding:0 8px;margin-bottom:12px;font-weight:700;font-size:17px;letter-spacing:.02em}
.nav{display:grid;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;color:var(--shell-dim);padding:9px 10px;border-radius:8px;font-weight:500;transition:background .15s,color .15s}
.nav a:hover{background:var(--shell2);color:var(--shell-fg)}
.nav a.on{background:var(--shell2);color:#fff}.nav a.on .ic{color:var(--gold)}
.nav .ct{margin-left:auto;font-family:var(--num);font-size:12px;font-weight:700;background:var(--gold);color:#1a1305;border-radius:9px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}
.nav .lv{margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--g-b)}
.nav .lv.off{background:var(--r-b)}
.rail hr{border:0;border-top:1px solid var(--shell-line);margin:12px 8px}
.me-row{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:center;padding:8px 10px;border-radius:8px;color:var(--shell-fg);transition:background .15s}
.me-row:hover,.me-row.on{background:var(--shell2)}
.me-row small{display:block;color:var(--shell-dim);font-size:11.5px;line-height:1.3}
.me-row b{display:block;line-height:1.3}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--gold);color:#1a1305;display:grid;place-items:center;font-weight:700;font-size:15px}
.rail-ft{padding:10px 10px 0;color:var(--shell-dim);font-size:11.5px;line-height:1.6}
.main{min-width:0}
.top{position:sticky;top:0;z-index:20;height:56px;background:var(--shell);color:var(--shell-fg);display:flex;align-items:center;gap:18px;padding:0 28px;border-bottom:1px solid var(--shell-line)}
.top .q{font-size:15px;font-weight:500;white-space:nowrap}
.top .sp{margin-left:auto}
.tchip{display:flex;gap:7px;align-items:center;font-size:12.5px;color:var(--shell-dim);white-space:nowrap}
.tchip b{color:var(--shell-fg);font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block;flex:none}
.dot.u{background:var(--g-b)}.dot.d{background:var(--r-b)}.dot.w{background:var(--warn-b)}
.kill{background:#d5392e;color:#fff;border:0;border-radius:8px;height:36px;padding:0 15px;font-weight:700;display:flex;gap:7px;align-items:center;white-space:nowrap;transition:background .15s}
.kill:hover:not(:disabled){background:#e84f43}
.kill:disabled{background:var(--shell2);color:var(--shell-dim);cursor:not-allowed}
.bar{display:flex;align-items:center;gap:16px;padding:12px 28px;background:var(--bad-s);border-bottom:1px solid var(--line);color:var(--fg)}
.bar.calm{background:var(--warn-s)}
.bar .t{flex:1;min-width:0}
.page{padding:22px 28px 64px;display:grid;gap:16px;max-width:1680px}

/* ---- 共用元件 ---- */
.ans{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
.ans h1{font-size:25px;line-height:1.35;font-weight:700;max-width:820px;text-wrap:balance}
.ans p{margin-top:6px;color:var(--dim);font-size:13px}
.pn{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0}
.pn>h2,.h2{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;min-height:26px;margin-bottom:12px}
.pn>h2 .sp,.h2 .sp{margin-left:auto;display:flex;gap:8px;align-items:center;font-weight:400}
.sub{color:var(--dim);font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:0 9px;font-size:12px;font-weight:500;line-height:22px;background:var(--grid);color:var(--dim);white-space:nowrap}
.chip.ok{background:var(--ok-s);color:var(--ok)}.chip.bad{background:var(--bad-s);color:var(--bad)}.chip.warn{background:var(--warn-s);color:var(--warn)}
.chip.you{background:var(--you-s);color:var(--you)}.chip.info{background:var(--info-s);color:var(--info)}
.chip.line{background:none;border:1px solid var(--line2);line-height:20px}
.why{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--you-l);background:var(--you-s);color:var(--you);border-radius:999px;padding:0 10px 0 7px;font-size:12px;line-height:22px;font-weight:500;white-space:nowrap;transition:border-color .15s}
.why:hover{border-color:var(--you)}
.btn{border:1px solid var(--line2);background:var(--panel);border-radius:8px;padding:6px 13px;white-space:nowrap;font-weight:500;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:border-color .15s,background .15s,filter .15s}
.btn:hover:not(:disabled){border-color:var(--fg)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-fg)}.btn.pri:hover:not(:disabled){filter:brightness(1.18)}
.btn.danger{background:var(--r-b);border-color:var(--r-b);color:#fff}.btn.danger:hover:not(:disabled){filter:brightness(1.1);border-color:var(--r-b)}
.btn.sm{padding:3px 9px;font-size:12px;border-radius:7px}
.btn.ghost{border-color:transparent;background:none;color:var(--dim)}.btn.ghost:hover:not(:disabled){background:var(--grid);color:var(--fg);border-color:transparent}
.sw{position:relative;width:34px;height:20px;border-radius:10px;background:var(--line2);border:0;flex:none;transition:background .15s;padding:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s cubic-bezier(.2,.8,.2,1)}
.sw[aria-checked=true]{background:var(--g-b)}.sw[aria-checked=true]::after{transform:translateX(14px)}
.sw:disabled{opacity:.55;cursor:not-allowed}
.seg{display:inline-flex;background:var(--grid);border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:none;padding:4px 11px;border-radius:6px;font-size:12.5px;color:var(--dim);font-weight:500;white-space:nowrap;transition:background .15s,color .15s}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.rw{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px solid var(--grid)}
.rw:last-child{border-bottom:0;padding-bottom:0}.rw:first-child{padding-top:0}
table{width:100%;border-collapse:collapse}
th{font-weight:500;font-size:12px;color:var(--dim);text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--grid);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:0}
th.r,td.r{text-align:right}
tbody tr:hover td{background:var(--panel2)}
.inp{width:100%;border:1px solid var(--line2);background:var(--panel);border-radius:8px;padding:7px 10px}
.inp:hover{border-color:var(--faint)}
.inp::placeholder{color:var(--faint)}
.dotc{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.ax{font-size:10.5px;fill:var(--faint);font-family:var(--num)}
.seg-arc{transition:stroke-width .15s}
.seg-arc:hover{stroke-width:22}

/* ---- 總覽 ---- */
.safe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:0}
.safe>div{display:grid;grid-template-columns:26px minmax(0,1fr);gap:2px 10px;padding:14px 18px;border-right:1px solid var(--grid);align-items:center}
.safe>div:last-child{border-right:0}
.safe .mk{grid-row:1/3;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--ok-s);color:var(--ok)}
.safe .mk.bad{background:var(--bad-s);color:var(--bad)}.safe .mk.warn{background:var(--warn-s);color:var(--warn)}
.safe .k{font-size:12.5px;color:var(--dim)}.safe .k b{color:var(--fg);font-size:15px;margin-left:6px}
.safe .d{font-size:12px;color:var(--faint);grid-column:2}
.ov2{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:16px;align-items:start}
.todo{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--grid)}
.todo:last-child{border-bottom:0;padding-bottom:0}
.todo .ti{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--grid);color:var(--dim)}
.todo .ti.ok{background:var(--ok-s);color:var(--ok)}.todo .ti.warn{background:var(--warn-s);color:var(--warn)}.todo .ti.you{background:var(--you-s);color:var(--you)}
.todo b{display:block;font-weight:700}
.bot-r{display:grid;grid-template-columns:10px minmax(0,1fr) 92px 86px 90px;gap:12px;align-items:center;padding:12px 8px;margin:0 -8px;border-bottom:1px solid var(--grid);border-radius:8px;transition:background .15s}
.bot-r:last-child{border-bottom:0}
a.bot-r:hover{background:var(--panel2)}
.bot-r .say{color:var(--dim);font-size:12.5px;margin-top:2px}
.bot-r .k{display:block;font-size:11.5px;color:var(--faint)}
.bot-r .v{font-weight:700}
.pie{display:grid;grid-template-columns:172px minmax(0,1fr);gap:16px;align-items:center}
.pie text.c1{fill:var(--dim);font-family:var(--sans)}.pie text.c2{fill:var(--fg);font-family:var(--num);font-weight:700}
.lg{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12.5px;padding:4px 0}
.ev{display:grid;grid-template-columns:18px 64px minmax(0,1fr);gap:8px;align-items:baseline;padding:7px 0;font-size:12.5px;border-bottom:1px solid var(--grid)}
.ev:last-child{border-bottom:0}
.ev .t{font-family:var(--num);color:var(--faint);font-size:12.5px}
.ev .e{color:var(--faint);align-self:center;display:grid}
.evg{font-size:12px;color:var(--dim);font-weight:700;padding:10px 0 4px;display:flex;gap:6px;align-items:center}
.evg:first-child{padding-top:0}

/* ---- 路線圖 ---- */
.rm-h,.rm-row{display:grid;grid-template-columns:var(--rmn,214px) minmax(0,1fr) var(--rmx,268px);align-items:center}
.rm-row{border-top:1px solid var(--grid);min-height:52px;transition:background .15s;border-radius:0}
a.rm-row:hover,.rm-row[role=button]:hover{background:var(--panel2)}
.rm-row.sel{background:var(--panel2)}
.rm-row.sel .rm-name b{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--c)}
.rm-name{padding:6px 8px;min-width:0}
.rm-name b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rm-name span{font-size:12px;color:var(--faint)}
.rm-track{position:relative;height:52px}
.rm-base{position:absolute;left:5.556%;right:5.556%;top:50%;border-top:2px dotted var(--line2);margin-top:-1px}
.rm-prog{position:absolute;left:5.556%;top:50%;height:4px;margin-top:-2px;border-radius:2px;background:var(--c)}
.st{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--panel);border:2px solid var(--line2);color:#fff;display:grid;place-items:center}
.st.p{background:var(--c);border-color:var(--c)}
.st.c,.st.r{border:4px solid var(--c)}
.st.a{background:var(--warn-b);border-color:var(--warn-b)}
.st.f{background:var(--r-b);border-color:var(--r-b);width:16px;height:16px;margin:-8px 0 0 -8px}
.st.d{border-radius:3px;transform:rotate(45deg)}
.st.y{background:var(--gold);border-color:var(--gold);width:16px;height:16px;margin:-8px 0 0 -8px}
.st.r::after,.st.y::after{content:"";position:absolute;inset:-4px;border-radius:inherit;animation:pulse 1.8s cubic-bezier(.2,.7,.2,1) infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--pc,var(--c)) 55%,transparent)}100%{box-shadow:0 0 0 9px transparent}}
.st.y{--pc:var(--gold)}
.rm-next{padding:6px 8px 6px 14px;font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:10px;justify-content:space-between;min-width:0}
.rm-next span{min-width:0}
.rm-hd{position:relative;height:66px}
.band{position:absolute;top:0;height:22px;border-radius:6px;background:var(--grid);font-size:12px;display:grid;place-items:center;color:var(--dim);font-weight:500;white-space:nowrap}
.band.you{background:var(--you-s);color:var(--you)}
.stl{position:absolute;top:28px;width:11.111%;margin-left:-5.556%;text-align:center;font-size:11.5px;line-height:1.35;color:var(--dim)}
.stl b{display:block;font-weight:500;color:var(--faint);font-size:11px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--dim);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .st{position:static;margin:0;display:inline-grid;--c:var(--info)}
.rm.mini{--rmn:176px}
.rm.mini .rm-h,.rm.mini .rm-row{grid-template-columns:var(--rmn) minmax(0,1fr)}
.rm.mini .rm-row{min-height:38px}.rm.mini .rm-track{height:38px}
.rm.mini .rm-hd{height:26px}.rm.mini .stl{display:none}
.gate{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start;padding:9px 0;border-bottom:1px solid var(--grid)}
.gate:last-child{border-bottom:0;padding-bottom:0}
.gate .gi{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--grid);color:var(--faint);margin-top:1px}
.gate .gi.p{background:var(--ok-s);color:var(--ok)}.gate .gi.f{background:var(--bad-s);color:var(--bad)}.gate .gi.a{background:var(--warn-s);color:var(--warn)}.gate .gi.r{background:var(--info-s);color:var(--info)}.gate .gi.y{background:var(--you-s);color:var(--you)}

/* ---- 研究 ---- */
.verdict{border-radius:10px;padding:16px 18px;background:var(--warn-s);display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:14px;align-items:start}
.verdict.p{background:var(--ok-s)}.verdict.f{background:var(--bad-s)}.verdict.i{background:var(--info-s)}
.verdict .vi{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--panel);color:var(--warn)}
.verdict.p .vi{color:var(--ok)}.verdict.f .vi{color:var(--bad)}.verdict.i .vi{color:var(--info)}
.verdict b{font-size:17px;display:block}
.std{display:grid;grid-template-columns:132px 78px minmax(110px,1fr) 128px 74px;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--grid)}
.std:last-child{border-bottom:0;padding-bottom:0}
.std.hd{padding:0 0 6px;font-size:12px;color:var(--dim)}
.rg{position:relative;height:8px;border-radius:4px;background:var(--grid)}
.rg .z{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--ok-s)}
.rg .tk{position:absolute;top:-5px;bottom:-5px;width:2px;margin-left:-1px;background:var(--you-b);border-radius:1px}
.rg .mk{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--ok-b);border:2px solid var(--panel)}
.rg .mk.x{background:var(--r-b)}
.cost{display:grid;grid-template-columns:64px minmax(0,1fr) 78px;gap:12px;align-items:center;padding:7px 0}
.cost .cb{height:12px;position:relative;background:var(--grid);border-radius:3px}.cost .cb i{position:absolute;top:0;bottom:0;left:0;border-radius:3px}
.heat{display:grid;grid-template-columns:40px repeat(12,minmax(0,1fr)) 58px;gap:3px;font-family:var(--num);font-size:11.5px}
.heat .hm,.heat .hy{color:var(--faint);text-align:center;align-self:center}
.heat .hc{text-align:center;padding:5px 0;border-radius:4px;color:var(--fg)}
.heat .ht{text-align:right;align-self:center;font-weight:700;font-size:12.5px}
.pick{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pick button{border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:4px 12px 4px 9px;font-size:12.5px;font-weight:500;display:inline-flex;gap:7px;align-items:center;transition:border-color .15s}
.pick button:hover{border-color:var(--fg)}
.pick button[aria-pressed=true]{background:var(--pri);border-color:var(--pri);color:var(--pri-fg)}

ME.rules=()=>{const dr=ST.draft;
  const row=r=>{const ed=ST.editRule===r.id,dv=r.edited?null:r.id==='r1'||r.id==='r3'?['#me','跟著「'+RS().n+'」','sliders']:r.id==='r5'?['#me','到作息改時間','moon']:null;
    return `<div class="rule${r.on?'':' off'}"><div>${ed?`<div class="addr"><input class="inp" id="ruleIn" value="${esc(ruleT(r))}" maxlength="40" data-enter="ruleSave" aria-label="改寫這條指示"><span class="row"><button type="button" class="btn pri" data-a="ruleSave" data-v="${r.id}">存起來</button><button type="button" class="btn" data-a="ruleEdit" data-v="">取消</button></span></div>`:`<div class="rt">${esc(ruleT(r))}${r.fixed?`<span class="chip">${I('lock',12)}系統固定，關不掉</span>`:''}</div>`}<div class="ru">Agent 的理解：${esc(ruleU(r))}</div><div class="rl">${I('clock',13)}${r.on?'最近一次：'+esc(r.last):'已關掉，現在不會檢查'}</div></div>
    <div class="ra">${dv?whyL(dv[0],dv[1],dv[2]):''}${sw('ruleTog',r.id,r.on,r.fixed,'啟用這條')}${r.fixed||dv?'':`<button type="button" class="btn sm ghost" data-a="ruleEdit" data-v="${r.id}" aria-label="改寫" title="改寫">${I('edit',15)}</button>`}${r.fixed?'':`<button type="button" class="btn sm ghost" data-a="ruleDel" data-v="${r.id}" aria-label="刪除" title="刪除">${I('trash',15)}</button>`}</div></div>`};
  const grp=(k,t,s)=>{const L=P.rules.filter(r=>r.k===k);return `<section class="pn"><h2>${t}<span class="chip n">${L.filter(r=>r.on).length}</span><span class="sp sub">${s}</span></h2>${L.length?L.map(row).join(''):'<div class="empty">這裡現在是空的。在上面寫一句話就能加。</div>'}</section>`};
  const add=`<section class="pn"><h2>加一條指示<span class="sp sub">用你的話寫。它先講它的理解，你確認了才算數。</span></h2><div class="addr"><input class="inp" id="rnew" maxlength="40" placeholder="例如：週末不要開新部位" data-enter="ruleDraft" aria-label="新的指示" value="${dr?esc(dr.t):''}"><button type="button" class="btn pri" data-a="ruleDraft">交給 Agent</button></div>
    ${dr?`<div class="und"><div class="row"><span class="youc">${I('spark',15)}</span><b>Agent 的理解</b><span style="margin-left:auto">${seg('draftK',dr.k,[['hard','當成界線'],['soft','當成習慣']])}</span></div><p style="margin:8px 0 12px">${esc(dr.und)}${dr.k==='hard'?'違反的下單或提案會被系統擋下，我繞不過去。':'我會照做；做不到的時候會告訴你原因。'}</p><div class="row"><button type="button" class="btn pri" data-a="draftOk">對，加進去</button><button type="button" class="btn" data-a="draftNo">不是這個意思</button></div></div>`:''}</section>`;
  const auto=`<section class="pn"><h2>誰可以做什麼</h2>${P.auto.map((r,i)=>`<div class="auto"><span>${r[0]}</span>${r[2]?`<span class="chip you">${I('lock',12)}只有你</span>`:seg('autoSet',r[1],[[0,'自己做'],[1,'先問我'],[2,'只有我']],i)}</div>`).join('')}<p class="s dim" style="margin-top:10px">部署、上實盤、解除鎖定、改風控，永遠只有你能按。這四項是系統寫死的，Agent 不能代按。</p></section>`;
  const blk=`<section class="pn"><h2>界線最近擋下的事</h2>${BLK.map(q=>`<div class="blk"><span class="n faint">${q[0]}</span><div><b>${q[1]}</b><div class="sub">${q[2]}　→　${q[3]}</div></div></div>`).join('')}</section>`;
  return `<div class="me2"><div class="stack">${add}${grp('hard','界線','系統會擋下來')}${grp('soft','習慣','Agent 會照做')}</div><div class="stack">${auto}${blk}</div></div>`};
A.ruleDraft=()=>{const el=$('#rnew'),t=el.value.trim().replace(/[。．.]+$/,'');if(t.length<3){el.focus();toast('先寫下你的指示，一句話就可以。');return}
  const k=/吵|通知|提醒|報告|早報|講|語氣|先|用.*算/.test(t)&&!/[%倍]/.test(t)?'soft':/不做|不碰|不要|不能|不可|禁止|最多|不超過|上限|[%倍]/.test(t)?'hard':'soft';
  ST.draft={t,k,und:`從現在起：${t}。`};render()};
A.draftK=(el,v)=>{if(ST.draft){ST.draft.k=v;render()}};
A.draftNo=()=>{ST.draft=null;render();const el=$('#rnew');if(el)el.focus()};
A.draftOk=()=>{const d=ST.draft;if(!d)return;const r={id:'u'+P.rules.length+Date.now()%1000,k:d.k,t:d.t,und:d.und+(d.k==='hard'?'違反的下單或提案會被擋下。':'做不到的時候會告訴你原因。'),last:'剛加上，還沒用到',on:true};P.rules.push(r);ST.draft=null;render();toast(`加進去了，放在「${d.k==='hard'?'界線':'習慣'}」。`,{t:'復原',fn(){P.rules=P.rules.filter(z=>z!==r);render()}})};
A.ruleTog=(el,v)=>{const r=RU(v);if(!r||r.fixed)return;const go=()=>{r.on=!r.on;render();toast(r.on?`「${esc(ruleT(r))}」重新生效。`:`已關掉「${esc(ruleT(r))}」。`)};
  if(r.on&&r.k==='hard')confirmDlg({title:'關掉這條界線？',body:`「${esc(ruleT(r))}」關掉之後，系統不會再擋。這是放寬風險，所以再問你一次。`,ok:'關掉',danger:true,fn:go});else go()};
A.ruleEdit=(el,v)=>{ST.editRule=v||null;render();const i=$('#ruleIn');if(i){i.focus();i.select()}};
A.ruleSave=(el,v)=>{const r=RU(v||ST.editRule),i=$('#ruleIn');if(!r||!i)return;const t=i.value.trim().replace(/[。．.]+$/,'');if(t.length<3){toast('寫一句話就可以，不能空白。');i.focus();return}
  if(t!==ruleT(r)){r.t=t;r.und=`從現在起：${t}。${r.k==='hard'?'違反的下單或提案會被擋下。':'做不到的時候會告訴你原因。'}`;r.edited=true;r.last='剛改過，還沒用到'}ST.editRule=null;render();toast('改好了。Agent 的理解也跟著更新。')};
A.ruleDel=(el,v)=>{const i=P.rules.findIndex(r=>r.id===v);if(i<0)return;const r=P.rules[i];if(r.fixed)return;
  const go=()=>{P.rules.splice(i,1);render();toast(`已刪掉「${esc(ruleT(r))}」。`,{t:'復原',fn(){P.rules.splice(i,0,r);render()}})};
  if(r.k==='hard'&&r.on)confirmDlg({icon:'trash',tone:'badc',title:'刪掉這條界線？',body:`「${esc(ruleT(r))}」刪掉之後，系統不會再擋。`,ok:'刪掉',danger:true,fn:go});else go()};
A.autoSet=(el,v)=>{const r=P.auto[+el.dataset.w];if(!r||r[2])return;r[1]=+v;render()};

/* 版面與通知 */
ME.layout=()=>{const D=document.documentElement.dataset,a=DB.acct,x=expo();
  const nb=(i,d)=>{for(let j=i+d;j>=0&&j<P.mods.length;j+=d)if(P.mods[j].col===P.mods[i].col)return j;return -1};
  const modRow=(m,i)=>`<div class="mod${m.on?'':' off'}"><span class="row" style="gap:0"><button type="button" class="btn sm ghost" data-a="modMv" data-v="-1" data-i="${i}" aria-label="${m.n}：往上"${nb(i,-1)<0?' disabled':''}>${I('up',14)}</button><button type="button" class="btn sm ghost" data-a="modMv" data-v="1" data-i="${i}" aria-label="${m.n}：往下"${nb(i,1)<0?' disabled':''}>${I('down',14)}</button></span><span class="mn">${m.n}${m.note?`<span class="sub" style="display:block">${m.note}</span>`:''}</span><button type="button" class="btn sm" data-a="modCol" data-i="${i}">移到${m.col==='a'?'右欄':'左欄'}</button>${sw('modTog',m.id,m.on,false,'顯示「'+m.n+'」')}</div>`;
  const colOf=c=>P.mods.map((m,i)=>m.col===c?modRow(m,i):'').join('');
  const wire=c=>P.mods.filter(m=>m.on&&m.col===c).map(m=>`<span>${m.n}</span>`).join('');
  const mods=`<section class="pn"><h2>總覽要放什麼<span class="sp sub">順序、左右、開關都可以改</span></h2><div class="evg">左欄（寬）</div>${colOf('a')||'<p class="s faint">左欄沒有東西。</p>'}<div class="evg" style="padding-top:14px">右欄（窄）</div>${colOf('b')||'<p class="s faint">右欄沒有東西。</p>'}
    <div class="wire"><div>${wire('a')}</div><div>${wire('b')}</div></div><p class="s dim">上面是總覽現在的排法。<a class="youc b" href="#overview">去看總覽</a></p></section>`;
  const notif=`<section class="pn"><h2>通知<span class="sp">${whyL('#me',dndT()+' 不吵你','moon')}</span></h2><table><thead><tr><th>什麼事</th><th>什麼時候送</th><th class="r">桌面</th><th class="r">手機<span class="chip" style="margin-left:6px">還沒接</span></th></tr></thead><tbody>${P.notif.map((n,i)=>`<tr><td>${n.n}${n.lock?` <span class="chip">${I('lock',12)}固定</span>`:''}</td><td>${n.lock||n.w===5?`<span class="dim">${P.notifW[n.w]}</span>`:`<select class="sel" data-c="notifW" data-i="${i}" aria-label="${n.n}：什麼時候送">${[1,2,3,4].map(w=>`<option value="${w}"${w===n.w?' selected':''}>${P.notifW[w]}</option>`).join('')}</select>`}</td><td class="r">${sw('notifCh',i,n.ch[0]&&n.w!==4,n.lock||n.w===4,n.n+'：桌面通知')}</td><td class="r">${sw('noop','',false,true,n.n+'：手機推播（還沒接）')}</td></tr>`).join('')}</tbody></table></section>`;
  const disp=`<section class="pn"><h2>顯示</h2>
    <div class="setr"><span>外觀</span>${seg('setTheme',D.theme,[['light','淺色'],['dark','深色']])}</div>
    <div class="setr"><span>漲跌顏色</span>${seg('setUD',D.updown,[['gu','綠漲紅跌'],['ru','紅漲綠跌']])}</div>
    <div class="setr"><span>損益怎麼看</span>${seg('setUnit',P.unit,[['usdt','USDT 金額'],['pct','百分比']])}</div>
    <div class="setr"><span>資訊量<span class="sub" style="display:block">精簡會收起每月賺賠表這類細節</span></span>${seg('setDen',D.density,[['full','完整'],['lite','精簡']])}</div></section>`;
  const night=DB.events.filter(e=>e[4]==='night'&&e[1]!=='risk').map(e=>e[0]+' '+esc(e[2])).join('；');
  const brief=`<section class="pn"><h2>早報長這樣<span class="sp sub">每天 07:30</span></h2><div class="brief"><b>${esc(P.call)}早。${rOn('r7')?'先講結論：':''}昨晚一切正常，沒有要馬上處理的事。</b><br>你睡覺時（${dndT()}）：${night||'沒有事情發生'}。帳本和 OKX 核對一致。<br>現在：權益 <span class="n">${f(a.eq)}</span> USDT，今天 <span class="n ${cl(a.today)}">${U(a.today)}</span>${UL()}；曝險 <span class="n">${f(x.used,2)}</span> 倍，上限 <span class="n">${f(x.cap,2)}</span> 倍。<br>等你決定：${DB.todo.length} 件，都不急。今晚 21:30 再一起提醒你。</div><div class="row wrap" style="margin-top:10px">${rOn('r7')?whyL('#me-rules','先講結論：你的習慣','user'):''}${rOn('r5')?whyL('#me-rules','半夜的事留到早上：你的指示','moon'):''}</div></section>`;
  return `<div class="me2"><div class="stack">${mods}${notif}</div><div class="stack">${disp}${brief}</div></div>`};
A.modMv=(el,v)=>{const i=+el.dataset.i,d=+v;let j=-1;for(let k=i+d;k>=0&&k<P.mods.length;k+=d)if(P.mods[k].col===P.mods[i].col){j=k;break}if(j<0)return;const t=P.mods[i];P.mods[i]=P.mods[j];P.mods[j]=t;render()};
A.modCol=el=>{const m=P.mods[+el.dataset.i];m.col=m.col==='a'?'b':'a';render()};
A.modTog=(el,v)=>{const m=P.mods.find(q=>q.id===v);if(!m)return;m.on=!m.on;render()};
A.notifW=(el,v)=>{P.notif[+el.dataset.i].w=+v;render()};
A.notifCh=(el,v)=>{const n=P.notif[+v];if(!n||n.lock)return;n.ch[0]=n.ch[0]?0:1;render()};
A.noop=()=>{};
A.setTheme=(el,v)=>{document.documentElement.dataset.theme=v;render()};
A.setUD=(el,v)=>{document.documentElement.dataset.updown=v;render()};
A.setUnit=(el,v)=>{P.unit=v;render()};
A.setDen=(el,v)=>{document.documentElement.dataset.density=v;render()};

/* ---------- 啟動 ----------
   掛鉤（給截圖與檢查用，一般使用不需要）：
   window.__PAGE  = 'risk' 或 'exec/rsi' 這類字串：開啟時直接到那一頁（優先於網址 hash）
   window.__THEME = 'dark'：開啟時用深色
   window.__AFTER = function(app){…}：第一次畫完後執行，例如 app.A.kill() 打開緊急停止對話框 */
window.CatOS={A,ST,P,DB,PAGES,render,nav};
document.body.insertAdjacentHTML('beforeend','<div class="tip" id="tip"></div>');
if(window.__THEME)document.documentElement.dataset.theme=window.__THEME;
nav(window.__PAGE||location.hash);
if(typeof window.__AFTER==='function'){try{window.__AFTER(window.CatOS)}catch(e){console.error(e)}}

</script>
</body>
</html>
