<!doctype html>
<html lang="zh-Hant" data-theme="night" data-density="cozy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CatOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141415;--deep:#0f0f10;--card:#19191b;--raise:#232325;--raise2:#2d2d30;
  --fg:#ededed;--fg2:#a1a1a6;--fg3:#85858b;
  --line:rgba(237,237,237,.08);--line2:rgba(237,237,237,.16);
  --acc:#f2a52b;--acc-ink:#f2a52b;--acc-soft:rgba(242,165,43,.12);--acc-soft2:rgba(242,165,43,.2);
  --up:#4cc38a;--down:#e5484d;--down-soft:rgba(229,72,77,.12);--down-line:rgba(229,72,77,.4);
  --s2:#7fa8dc;--s3:#b9b3a7;
  --btn:#ededed;--on-btn:#141415;--hi:inset 0 1px 0 rgba(255,255,255,.06);
  --float:0 16px 48px rgba(0,0,0,.5);
  --sans:"Geist","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"Geist Mono","JetBrains Mono",Consolas,ui-monospace,monospace;
  --pad:20px;--row:44px;--gap:16px;--ease:cubic-bezier(.22,1,.36,1)
}
[data-theme=day]{
  --bg:#fafafa;--deep:#f4f4f5;--card:#fff;--raise:#f4f4f5;--raise2:#e9e9eb;
  --fg:#171717;--fg2:#525252;--fg3:#737373;
  --line:rgba(23,23,23,.09);--line2:rgba(23,23,23,.18);
  --acc-ink:#8a5200;--acc-soft:rgba(242,165,43,.16);--acc-soft2:rgba(242,165,43,.28);
  --up:#15803d;--down:#d02525;--down-soft:rgba(220,38,38,.07);--down-line:rgba(220,38,38,.35);
  --s2:#3f73b8;--s3:#8c877d;
  --btn:#171717;--on-btn:#fff;--hi:0 1px 2px rgba(0,0,0,.05);
  --float:0 8px 24px rgba(0,0,0,.1)
}
[data-density=compact]{--pad:12px;--row:36px;--gap:12px}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:400 14px/22px var(--sans);-webkit-font-smoothing:antialiased;min-width:1180px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p,ol,ul{margin:0;padding:0}
svg{display:block}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.m{font-family:var(--mono);font-variant-numeric:tabular-nums}
.t2{color:var(--fg2)}.t3{color:var(--fg3)}.up{color:var(--up)}.down{color:var(--down)}.acc{color:var(--acc-ink)}
.s{font-size:13px;line-height:20px}.xs{font-size:12px;line-height:16px}
.r{text-align:right}.nw{white-space:nowrap}
.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.dot{width:8px;height:8px;border-radius:50%;background:var(--fg3);display:inline-block;flex:none}
.dot.u{background:var(--up)}.dot.d{background:var(--down)}.dot.a{background:var(--acc)}

/* 外框 */
.side{position:fixed;left:0;top:0;bottom:0;width:248px;background:var(--deep);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px 12px;z-index:30;overflow-y:auto}
.brand{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;font-size:17px;line-height:1;font-weight:600}
.brand svg{width:22px;height:22px;color:var(--acc)}
.nl{font-size:12px;line-height:16px;color:var(--fg3);padding:24px 8px 8px}
.nv{display:flex;align-items:center;gap:8px;width:100%;height:36px;padding:0 8px;margin-bottom:2px;border:0;border-radius:8px;background:none;color:var(--fg2);text-align:left;transition:background-color .15s var(--ease),color .15s var(--ease)}
.nv .i{color:var(--fg3)}
.nv:hover{background:var(--raise);color:var(--fg)}
.nv.on{background:var(--raise);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line),var(--hi)}
.nv.on .i{color:var(--acc-ink)}
.nv .q{margin-left:auto;font:400 12px/16px var(--mono);color:var(--fg3)}
.own{margin-top:auto;display:flex;gap:12px;align-items:center;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--card);text-align:left;width:100%;transition:border-color .15s var(--ease)}
.own:hover{border-color:var(--line2)}
.av{width:32px;height:32px;border-radius:50%;background:var(--raise2);display:grid;place-items:center;font-weight:500;flex:none}
.main{margin-left:248px;min-height:900px}
.top{position:sticky;top:0;z-index:20;height:56px;display:flex;align-items:center;gap:12px;padding:0 32px;background:var(--bg);border-bottom:1px solid var(--line)}
.ttl{display:flex;align-items:baseline;gap:12px;min-width:0;margin-right:auto}
.ttl b{font-size:16px;font-weight:500;white-space:nowrap}.ttl span{color:var(--fg3);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 8px;border:0;background:none;border-radius:8px;color:var(--fg2);font-size:13px;white-space:nowrap}
button.st:hover{background:var(--raise);color:var(--fg)}
.kill{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px;border:1px solid var(--down-line);border-radius:8px;background:var(--down-soft);color:var(--down);font-weight:500;white-space:nowrap;transition:background-color .15s var(--ease),color .15s var(--ease)}
.kill:hover{background:var(--down);color:#fff}
.page{max-width:1600px;padding:24px 32px 64px;display:grid;gap:var(--gap)}
.banner{margin:16px 32px 0;border:1px solid var(--down-line);background:var(--down-soft);border-radius:12px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.g{display:grid;gap:var(--gap);min-width:0}
.col2{display:grid;gap:var(--gap);align-items:start}

/* 元件 */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:var(--pad);min-width:0}
.ct{display:flex;align-items:center;gap:8px;margin-bottom:16px;min-height:24px}
.ct h2{font-size:14px;line-height:20px;font-weight:500;white-space:nowrap}
.ct .sp{margin-left:auto;display:flex;gap:8px;align-items:center;min-width:0}
.tag{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 6px;border-radius:6px;background:var(--raise);color:var(--fg2);font-size:12px;line-height:20px;white-space:nowrap}
.by{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 6px;border:0;border-radius:6px;background:var(--acc-soft);color:var(--acc-ink);font-size:12px;line-height:20px;white-space:nowrap;vertical-align:middle;transition:background-color .15s var(--ease)}
.by:hover{background:var(--acc-soft2)}
.by svg{width:10px;height:8px;fill:currentColor}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:32px;padding:0 12px;border:1px solid var(--line2);border-radius:8px;background:var(--raise);color:var(--fg);font-size:13px;font-weight:500;white-space:nowrap;transition:background-color .15s var(--ease),border-color .15s var(--ease),transform .12s var(--ease)}
.btn:hover:not(:disabled){background:var(--raise2)}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:var(--btn);border-color:var(--btn);color:var(--on-btn)}
.btn.pri:hover:not(:disabled){background:var(--btn);opacity:.88}
.btn.danger{background:var(--down);border-color:var(--down);color:#fff}
.btn.danger:hover:not(:disabled){background:var(--down);opacity:.9}
.btn.red{color:var(--down);border-color:var(--down-line);background:var(--down-soft)}
.btn.quiet{border-color:transparent;background:none;color:var(--fg2)}
.btn.quiet:hover:not(:disabled){background:var(--raise);color:var(--fg)}
.btn.ib{width:28px;height:28px;padding:0}
.btn.lg{height:40px;padding:0 16px;font-size:14px}
.sw{position:relative;width:36px;height:20px;border:0;border-radius:10px;background:var(--raise2);flex:none;transition:background-color .15s var(--ease)}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--fg3);transition:transform .15s var(--ease),background-color .15s var(--ease)}
.sw.on{background:var(--fg)}.sw.on::after{transform:translateX(16px);background:var(--bg)}
.sw:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;padding:2px;gap:2px;border:1px solid var(--line);border-radius:8px;background:var(--deep)}
.seg button{height:28px;padding:0 12px;border:0;border-radius:6px;background:none;color:var(--fg2);font-size:13px;white-space:nowrap;transition:background-color .15s var(--ease),color .15s var(--ease)}
.seg button:hover{color:var(--fg)}
.seg button.on{background:var(--raise);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line),var(--hi)}
.seg button:disabled{cursor:not-allowed;opacity:.6}
table{width:100%;border-collapse:collapse}
th{font-weight:400;font-size:12px;line-height:16px;color:var(--fg3);text-align:left;padding:0 12px 8px 0;white-space:nowrap}
td{height:var(--row);padding:8px 12px 8px 0;border-top:1px solid var(--line);font-size:13px;line-height:20px;vertical-align:middle}
th:last-child,td:last-child{padding-right:0}
th.r,td.r{text-align:right}
td.m,td .m{font-size:12px}
tr.row{cursor:pointer}tr.row:hover td{background:var(--raise)}
.rw{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:var(--row);padding:8px 0;border-top:1px solid var(--line)}
.rw:first-child{border-top:0;padding-top:0}
.rw:last-child{padding-bottom:0}
.hl{font-size:32px;line-height:40px;font-weight:500}
.k{font-size:12px;line-height:16px;color:var(--fg3)}
.v{font-size:28px;line-height:32px;font-weight:500;font-variant-numeric:tabular-nums;margin:4px 0;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;background:var(--card)}
.stats>div{padding:16px 20px;border-left:1px solid var(--line);min-width:0}.stats>div:first-child{border-left:0}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 520px;gap:32px;align-items:end;padding:8px 0}
.facts{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:12px;font-size:13px;line-height:20px;color:var(--fg2);align-items:center}
.facts b{color:var(--fg);font-weight:500}
.say{background:var(--raise);border-radius:10px;padding:12px 16px}
.empty{border:1px dashed var(--line2);border-radius:8px;padding:16px 12px;font-size:12px;line-height:16px;color:var(--fg3);text-align:center}
.ax{font:400 11px var(--mono);fill:var(--fg3)}

/* 總覽 */
.todo{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.todo:first-of-type{border-top:0;padding-top:0}.todo:last-child{padding-bottom:0}
.todo.first{background:var(--raise);border:0;border-radius:10px;padding:12px 16px;margin-bottom:4px}
.todo.first+.todo{border-top:0}
.lgd{display:grid;grid-template-columns:8px minmax(0,1fr) auto 40px;gap:12px;align-items:center;min-height:36px;font-size:13px;line-height:20px}
.ev{display:grid;grid-template-columns:72px 44px minmax(0,1fr);gap:12px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line);font-size:13px;line-height:20px}
.ev:first-child{border-top:0;padding-top:0}.ev:last-child{padding-bottom:0}
.pl{display:grid;grid-template-columns:56px 20px minmax(0,1fr);gap:12px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line);font-size:13px;line-height:20px}
.pl:first-child{border-top:0;padding-top:0}.pl:last-child{padding-bottom:0}

/* 策略 */
.kan{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:start}
.kcol{background:var(--deep);border:1px solid var(--line);border-radius:16px;padding:8px}
.kh{display:flex;align-items:baseline;gap:8px;padding:8px 8px 0;font-weight:500}
.kh span{font:400 12px/16px var(--mono);color:var(--fg3)}
.ks{font-size:12px;line-height:16px;color:var(--fg3);padding:4px 8px 12px;min-height:52px}
.kc{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s var(--ease),background-color .15s var(--ease)}
.kc:last-child{margin-bottom:0}
.kc:hover{border-color:var(--line2)}
.kc.on{border-color:var(--fg3);background:var(--raise);box-shadow:var(--hi)}
.gb{display:flex;gap:2px;margin:12px 0 8px}
.gb i{flex:1;height:4px;border-radius:2px;background:var(--raise2)}
.kc.on .gb i{background:var(--line2)}
.gb i.p,.kc.on .gb i.p{background:var(--fg3)}.gb i.f,.kc.on .gb i.f{background:var(--down)}.gb i.r,.kc.on .gb i.r{background:var(--fg)}.gb i.a,.kc.on .gb i.a{background:var(--acc)}
.gate{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.gate:first-of-type{border-top:0}
.gm{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line2);color:var(--fg3);margin-top:2px}
.gm .i{width:12px;height:12px;stroke-width:2}
.gm.p{border-color:transparent;background:var(--raise2);color:var(--fg)}
.gm.f{border-color:transparent;background:var(--down-soft);color:var(--down)}
.gm.r{border-color:var(--fg2);color:var(--fg)}
.gm.a{border-color:transparent;background:var(--acc-soft);color:var(--acc-ink)}

/* 研究 */
.verdict{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;background:var(--raise);border-radius:12px;padding:20px 24px}
.verdict h3{font-size:20px;line-height:28px;font-weight:500}
.gs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line);border-radius:12px}
.gs>div{padding:12px 16px;border-left:1px solid var(--line);min-width:0}.gs>div:first-child{border-left:0}
.qa{display:grid;grid-template-columns:20px 160px minmax(0,1fr) auto;gap:16px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.qa:first-of-type{border-top:0}
.qa .fig{font-size:20px;line-height:28px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.cost{display:grid;grid-template-columns:64px minmax(0,1fr) 80px;gap:12px;align-items:center;min-height:32px;font-size:13px}
.cost .b{height:4px;border-radius:2px;background:var(--raise2);position:relative}
.cost .b i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--fg2)}
.heat{display:grid;grid-template-columns:40px repeat(12,minmax(0,1fr));gap:4px;font:400 11px/16px var(--mono)}
.heat .hm,.heat .hy{color:var(--fg3);text-align:center;align-self:center}
.heat .hc{text-align:center;padding:4px 0;border-radius:4px;color:var(--fg)}

/* 執行 */
.bl{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;transition:border-color .15s var(--ease),background-color .15s var(--ease)}
.bl:hover{border-color:var(--line2)}
.bl.on{background:var(--raise);border-color:var(--fg3);box-shadow:var(--hi)}

/* 風控 */
.way{border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
.way+.way{margin-top:8px}

/* 我的 CatOS */
.idc{position:relative;height:208px;border-radius:16px;padding:24px;background:linear-gradient(145deg,#2c2c2f,#1c1c1e);border:1px solid rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 12px 32px rgba(0,0,0,.28);color:#ededed;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.idc .cat{position:absolute;right:-24px;bottom:-40px;width:184px;height:184px;color:rgba(255,255,255,.04)}
.idc .chip{width:40px;height:28px;border-radius:6px;background:linear-gradient(135deg,#f6c15e,#c98414);box-shadow:inset 0 1px 0 rgba(255,255,255,.35);position:relative}
.idc .chip::after{content:"";position:absolute;inset:6px 12px;border-left:1px solid rgba(60,36,0,.4);border-right:1px solid rgba(60,36,0,.4)}
.idc .k{color:#a1a1a6}
.scale{position:relative;height:8px;border-radius:4px;background:var(--raise2);margin:28px 0 8px}
.scale i{position:absolute;top:-6px;width:4px;height:20px;border-radius:2px;background:var(--acc);margin-left:-2px}
.scale b{position:absolute;top:-28px;transform:translateX(-50%);font-size:12px;line-height:16px;font-weight:500;color:var(--acc-ink);white-space:nowrap}
.sl{display:flex;justify-content:space-between;font-size:12px;line-height:16px;color:var(--fg3)}
.day{display:flex;height:36px;border-radius:8px;overflow:hidden;gap:2px}
.day span{display:grid;place-items:center;font-size:12px;line-height:16px;color:var(--fg2);background:var(--raise);white-space:nowrap;overflow:hidden}
.day span.q{background:var(--deep);color:var(--fg3);box-shadow:inset 0 0 0 1px var(--line)}
.day span.d{background:var(--acc);color:#1a1206;font-weight:500}
.day span.w{background:var(--raise2)}
.hist{display:flex;align-items:flex-end;gap:2px;height:44px}
.hist i{flex:1;background:var(--fg3);border-radius:2px 2px 0 0;min-height:2px;opacity:.6}
.hist i.pk{background:var(--acc);opacity:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip2{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 10px;border-radius:8px;background:var(--raise);font-size:13px;white-space:nowrap}
.chip2.off{background:none;box-shadow:inset 0 0 0 1px var(--line);color:var(--fg3);text-decoration:line-through}
.mem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;padding:16px 0;border-top:1px solid var(--line);align-items:start}
.mem:first-of-type{border-top:0;padding-top:0}.mem:last-child{padding-bottom:0}
.mem h3{font-size:15px;line-height:22px;font-weight:500}
.quote{border-left:2px solid var(--line2);padding-left:12px;margin:8px 0;color:var(--fg2);font-size:13px;line-height:20px}
.ask{border:1px solid var(--line);background:var(--raise);border-radius:12px;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
.ask+.ask{margin-top:8px}
.rule{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:16px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.rule:first-of-type{border-top:0;padding-top:0}.rule:last-child{padding-bottom:0}
.inp{width:100%;height:40px;padding:0 12px;border:1px solid var(--line2);border-radius:8px;background:var(--deep);color:var(--fg)}
.inp::placeholder{color:var(--fg3)}
textarea.inp{height:88px;padding:8px 12px;line-height:22px;resize:vertical}
.wire{display:grid;gap:8px;padding:12px;border-radius:10px;background:var(--deep);border:1px solid var(--line)}
.wire>div{display:grid;gap:4px;align-content:start}
.wire span{display:block;border-radius:6px;background:var(--raise);padding:6px 8px;font-size:12px;line-height:16px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wire span.rk{background:var(--acc-soft);color:var(--acc-ink)}
.ord{display:grid;grid-template-columns:20px minmax(0,1fr) auto auto;gap:12px;align-items:center;min-height:var(--row);padding:6px 0;border-top:1px solid var(--line)}
.ord:first-of-type{border-top:0}
.ord.off .nm{color:var(--fg3)}
.nt{display:grid;grid-template-columns:minmax(0,1fr) 64px 64px 64px;gap:8px;align-items:center;min-height:var(--row);padding:4px 0;border-top:1px solid var(--line)}
.nt.h{border-top:0;min-height:24px;font-size:12px;color:var(--fg3)}
.nt>*:not(:first-child){justify-self:center}
.brief{background:var(--deep);border:1px solid var(--line);border-radius:12px;padding:16px}
.brief li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;padding:6px 0;font-size:13px;line-height:20px;list-style:none}
.brief li span:first-child{font:400 12px/20px var(--mono);color:var(--fg3)}

/* 對話框 */

.tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:8px}
.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);z-index:70;background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:13px;line-height:20px;box-shadow:var(--float);animation:rise .22s var(--ease)}

  $('#view').innerHTML=PAGES[PAGE].v();document.title='CatOS · '+PAGES[PAGE].n;drawAll()}
function go(p,keep){if(!PAGES[p])return;const ch=p!==PAGE;PAGE=p;try{if(location.hash.slice(1)!==p)location.hash=p}catch(e){}if(ch){const v=$('#view');v.style.animation='none';void v.offsetWidth;v.style.animation=''}render();if(ch&&!keep)scrollTo(0,0)}
function toast(m){$$('.toast').forEach(n=>n.remove());const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}
function dlg(html,w){closeDlg();const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="dlg" role="dialog" aria-modal="true" ${w?`style="width:${w}px"`:''}>${html}</div>`;o.addEventListener('mousedown',e=>{if(e.target===o)closeDlg()});document.body.appendChild(o);const i=$('input,textarea',o)||$('.acts .btn',o);if(i)i.focus()}

  'mem-del':el=>{const m=P.mem.find(x=>x.id===el.dataset.id);dlg(`<h3>要 Agent 忘掉這一條？</h3><p>「${esc(m.t)}」</p><p>忘掉後，${m.use.map(u=>PN[u[0]]+'的「'+u[1]+'」').join('、')}會回到預設。</p><label>為什麼不對（可以不填，Agent 會記得別再這樣猜）<input class="inp" id="mw"></label><div class="acts"><button class="btn" data-act="close">取消</button><button class="btn danger" data-act="mem-del-do" data-id="${m.id}">忘掉</button></div>`)},

  'mem-edit-do':el=>{const m=P.mem.find(x=>x.id===el.dataset.id),v=$('#mt').value.trim();if(!v)return;m.t=v;m.src='said';m.ev='剛剛你親手改的';m.last='剛剛';closeDlg();render();toast('已更新，之後照這一條做')},
  'ask-ok':el=>{const i=P.ask.findIndex(x=>x.id===el.dataset.id),a=P.ask[i];P.mem.unshift({id:'n'+Date.now(),src:'said',t:a.t,ev:'剛剛你確認了 Agent 的觀察。'+a.sug,use:[['me-layout','提醒']],last:'剛剛'});P.ask.splice(i,1);render();toast('記住了，會照這樣做')},
  'ask-no':el=>{const i=P.ask.findIndex(x=>x.id===el.dataset.id),a=P.ask[i];P.gone.unshift({t:a.t,when:'剛剛',why:'你說不對'});P.ask.splice(i,1);render();toast('好，不會這樣做，也不會再這樣猜')},
  'rule-toggle':el=>{const r=P.rules.find(x=>x.id===el.dataset.id);if(r.lock)return;if(r.on&&r.hard){dlg(`<h3>關掉這條界線？</h3><p>「${esc(r.t)}」</p><p>關掉後系統不會再擋。這是你的安全線，確定要關嗎？</p><div class="acts"><button class="btn" data-act="close">不關了</button><button class="btn danger" data-act="rule-off" data-id="${r.id}">關掉</button></div>`);return}r.on=r.on?0:1;render()},

  'rule-del':el=>{const r=P.rules.find(x=>x.id===el.dataset.id);dlg(`<h3>刪掉這一條？</h3><p>「${esc(r.t)}」</p><div class="acts"><button class="btn" data-act="close">取消</button><button class="btn danger" data-act="rule-del-do" data-id="${r.id}">刪掉</button></div>`)},
  'rule-del-do':el=>{P.rules=P.rules.filter(x=>x.id!==el.dataset.id);closeDlg();render();toast('已刪掉')},

  auto:el=>{const a=P.auto[+el.dataset.i];if(a[3])return;a[1]=+el.dataset.j;render()},

  'idea-open':()=>dlg(`<h3>新想法</h3><p>用一句話寫下來就好，剩下的交給 Agent。</p><textarea class="inp" id="idt" placeholder="例如：連續三天下跌後的第一根陽線買進"></textarea><div class="chk" style="margin-top:12px">${ic('check','t2')}<span class="t2">Agent 會先對過你的規矩：幣種、週期、能不能做空</span></div><div class="acts"><button class="btn" data-act="close">取消</button><button class="btn pri" data-act="idea-do">存成想法</button></div>`),
  'idea-do':()=>{const v=$('#idt').value.trim();if(!v){$('#idt').focus();return}const id='u'+Date.now();DB.strats.push({id,name:v.length>14?v.slice(0,14)+'…':v,desc:v,sym:'BTC',tf:'4H',stage:'idea',by:'你',g:'wwwwww',seed:91,note:'剛寫下來，還只是一句話'});ST.sel=id;closeDlg();render();toast('存好了，在「想法」那一欄')},
  'to-research':el=>{const s=DB.S(el.dataset.id);s.stage='research';s.g='rwwwww';s.note='Agent 開始研究，今晚 21:00 後回報';s.yrs=s.yrs||4.87;DB.todo=DB.todo.filter(t=>t.id!==s.id);render();toast('已交給 Agent。它會先跑扣掉成本的回測')},
  'drop-open':el=>{const s=DB.S(el.dataset.id);dlg(`<h3>收掉「${esc(s.name)}」？</h3><p>研究紀錄會留著，之後想重新開始隨時可以。</p><label>原因（可以不填，Agent 會記得你為什麼不做）<input class="inp" id="dw"></label><div class="acts"><button class="btn" data-act="close">取消</button><button class="btn danger" data-act="drop-do" data-id="${s.id}">收掉</button></div>`)},
  'drop-do':el=>{const s=DB.S(el.dataset.id);DB.strats=DB.strats.filter(x=>x.id!==s.id);DB.todo=DB.todo.filter(t=>t.id!==s.id);if(ST.sel===s.id)ST.sel='ens';if(ST.rs===s.id)ST.rs='don4h';closeDlg();if(PAGE==='research')go('strategies');else render();toast('已收掉：'+s.name)},
  'deploy-open':el=>{const s=DB.S(el.dataset.id),A=acct(),bud=A.eq*A.levMax,used=bots().reduce((a,b)=>a+b.notional,0),add=1054.77,rc=ruleCheck(s);

      <div class="k" style="margin:16px 0 4px">和你的規矩對過了</div>${rc.map(([c,n,t])=>`<div class="chk">${c==='p'?ic('check','t2'):ic('warn','acc')}<span><span class="t3">${n}　</span>${t}</span></div>`).join('')}<div class="chk">${ic('check','t2')}<span><span class="t3">額度　</span>部署後還在 0.50 倍以內</span></div>
      <label style="display:flex;gap:8px;align-items:center;cursor:pointer;color:var(--fg)"><input type="checkbox" id="dc" style="width:16px;height:16px;accent-color:var(--acc)">我看過研究報告了，同意讓它在模擬盤自動下單</label>
      <div class="acts"><button class="btn" data-act="close">取消</button><button class="btn" data-act="rs" data-id="${s.id}">先看報告</button><button class="btn pri" data-act="deploy-do" data-id="${s.id}" id="db" disabled>確認部署</button></div>`)},
  'deploy-do':el=>{const s=DB.S(el.dataset.id);s.stage='demo';s.g='pppprw';s.note='剛部署，等第一根 K 線收盤';DB.todo=DB.todo.filter(t=>t.id!==s.id);
    if(!DB.bots.find(b=>b.id===s.id))DB.bots.push({id:s.id,inst:s.sym+'-USDT-SWAP',pos:'空手',side:0,qty:0,avg:null,mark:105477,un:0,today:0,total:0,days:0,drift:0,lev:0,notional:0,ref:1054.77,cnt:0,nextAt:'08:00',next:'1 小時 13 分',seed:131,fresh:true,wait:'剛部署，還沒有部位。等 08:00 這根日線收盤後做第一次決定'});
    ST.bot=s.id;ST.sel=s.id;closeDlg();render();toast(s.name+' 已部署到模擬盤')},
  'kill-open':el=>{ST.km=el.dataset.m||null;const B=bots(),pos=B.filter(b=>b.side).reduce((a,b)=>a+b.qty,0),un=acct().unreal,fee=B.reduce((a,b)=>a+b.notional,0)*.0005;

      ${o('flat','平倉並停止',`用市價平掉 ${pos} 張部位。還沒實現的 ${sg(un)} 會變成已實現，手續費約 ${f(fee)} USDT`)}
      ${o('keep','保留部位只停止',`所有 Bot 不再做決定，${pos} 張部位留在 OKX。之後沒有 Bot 看著它們，要你自己處理`)}</div>

  'kill-do':()=>{if(!ST.km)return;ST.kill={mode:ST.km,t:'06:47:52',r:($('#kr').value.trim()||'沒有填')};closeDlg();render();scrollTo(0,0)},
  'unlock-open':()=>{const k=ST.kill;dlg(`<h3>解除鎖定</h3><p>${k.t} 你按了緊急停止（${k.mode==='flat'?'平倉並停止':'保留部位只停止'}）。原因：${esc(k.r)}</p>

    <label style="display:flex;gap:8px;align-items:center;cursor:pointer;color:var(--fg)"><input type="checkbox" id="uc" style="width:16px;height:16px;accent-color:var(--acc)">我確認停下來的原因已經排除，可以解除</label><div class="acts"><button class="btn" data-act="close">取消</button><button class="btn pri" data-act="unlock-do" id="ub" disabled>解除鎖定</button></div>`)},

  'stop-open':el=>{const b=bots().find(x=>x.id===el.dataset.id),s=DB.S(b.id);ST.km=b.side?null:'keep';

      <div class="acts"><button class="btn" data-act="close">取消</button><button class="btn danger" data-act="stop-do" data-id="${b.id}" id="kb" ${ST.km?'':'disabled'}>${ST.km?'停止這個 Bot':'先選一種停法'}</button></div>`)},
  'stop-do':el=>{ST.stop[el.dataset.id]=ST.km||'keep';closeDlg();render();toast('已停止：'+DB.S(el.dataset.id).name)},
  'start-bot':el=>{if(ST.kill)return;delete ST.stop[el.dataset.id];render();toast('已重新啟動，等下一根 K 線收盤')}
};
document.addEventListener('click',e=>{const a=e.target.closest('[data-act],[data-go]');if(!a||a.disabled)return;if(a.dataset.act){if(ACT[a.dataset.act])ACT[a.dataset.act](a,e)}else{closeDlg();go(a.dataset.go)}});

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDlg();if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button][data-act]')){e.preventDefault();e.target.click()}if(e.key==='Enter'&&e.target.id==='ri')ACT['rule-parse']()});
addEventListener('hashchange',()=>{const p=location.hash.slice(1);if(PAGES[p]&&p!==PAGE)go(p)});
let _rt;addEventListener('resize',()=>{clearTimeout(_rt);_rt=setTimeout(drawAll,120)});

PAGE=window.__PAGE||location.hash.slice(1);if(!PAGES[PAGE])PAGE='overview';
render();
if(window.__AFTER)window.__AFTER();
