<!doctype html>
<html lang="zh-Hant" data-theme="day" data-color="okx" data-density="roomy">
<head><script>window.__THEME='night'</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CatOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Sans+TC:wght@400;500;600;700&family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
/* 顏色的意思：金色＝你（你定的、等你決定的）；紫色＝Agent；綠紅＝賺賠；深紅＝停止。 */
:root{
  --canvas:#eceef1;--pane:#ffffff;--inset:#f4f5f7;--line:#dce0e6;--line2:#c3c9d2;--grid:#e8ebef;--fg:#141920;--dim:#566070;--faint:#929ba8;
  --gold:#f2b33d;--gold-ink:#7a5200;--gold-soft:#fcf1d3;--gold-line:#e6c672;
  --agent:#5b4fd1;--agent-soft:#eceafb;
  --green:#0f9968;--green-soft:#e0f4ec;--red:#d4433b;--red-soft:#fbe7e5;
  --warn:#c4620a;--warn-soft:#fcebd9;--danger:#c9302c;--danger-soft:#fbe6e5;
  --rail:#0f1318;--rail-2:#19202a;--rail-fg:#d5d9e0;--rail-dim:#7f8896;--rail-line:#252d38;
  --up:var(--green);--up-soft:var(--green-soft);--down:var(--red);--down-soft:var(--red-soft);
  --pad:18px;--gap:14px;
  --sans:"Bahnschrift","Barlow Semi Condensed","IBM Plex Sans TC","Microsoft JhengHei UI","Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
  --kai:"Bahnschrift","Barlow Semi Condensed","LXGW WenKai TC","DFKai-SB","BiauKai","Kaiti TC","KaiTi",serif;
}
html[data-theme="night"]{
  --canvas:#0b0e12;--pane:#12161c;--inset:#181d25;--line:#262d38;--line2:#37404d;--grid:#1d232c;--fg:#e8ebf0;--dim:#9aa4b2;--faint:#687282;
  --gold-ink:#f2b33d;--gold-soft:rgba(242,179,61,.13);--gold-line:rgba(242,179,61,.42);
  --agent:#a99cff;--agent-soft:rgba(169,156,255,.15);
  --green:#2dc98e;--green-soft:rgba(45,201,142,.15);--red:#ff6a61;--red-soft:rgba(255,106,97,.15);
  --warn:#ff9d42;--warn-soft:rgba(255,157,66,.15);--danger:#e5443e;--danger-soft:rgba(229,68,62,.16);
  --rail:#0b0e12;--rail-2:#161b23;
}
html[data-color="tw"]{--up:var(--red);--up-soft:var(--red-soft);--down:var(--green);--down-soft:var(--green-soft)}
html[data-density="tight"]{--pad:13px;--gap:10px}
*{box-sizing:border-box}
html,body{margin:0}
html{background:var(--canvas)}
body{display:flex;align-items:stretch;background:var(--canvas);color:var(--fg);font:14px/1.55 var(--sans);font-variant-numeric:tabular-nums;min-height:900px;-webkit-font-smoothing:antialiased}
html[data-density="tight"] body{font-size:13px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
.dim{color:var(--dim)}.faint{color:var(--faint)}.up{color:var(--up)}.down{color:var(--down)}.warn{color:var(--warn)}.gold{color:var(--gold-ink)}.ag{color:var(--agent)}
.s{font-size:12.5px}.xs{font-size:12px}.r{text-align:right}.b{font-weight:600}.k{font-family:var(--kai)}
.nw{white-space:nowrap}

/* 外框：左側選單 */
.rail{flex:none;width:232px;background:var(--rail);color:var(--rail-fg);border-right:1px solid var(--rail-line)}
.rail-in{position:sticky;top:0;height:800px;display:flex;flex-direction:column;padding:18px 12px 12px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand .mk{width:30px;height:30px;border-radius:8px;background:var(--gold);display:grid;place-items:center;flex:none}
.brand b{font-size:19px;color:#fff;line-height:1.1;display:block}
.brand small{font-size:12px;color:var(--rail-dim)}
.me-card{margin:16px 0 4px;padding:11px 12px;border:1px solid var(--rail-line);border-radius:10px;display:grid;grid-template-columns:38px minmax(0,1fr);gap:11px;align-items:center;background:none;text-align:left;width:100%;color:inherit;text-decoration:none}
.me-card:hover,.me-card.on{background:var(--rail-2);border-color:#3a4452}
.ava{width:38px;height:38px;border-radius:50%;background:#1b222c;border:2px solid var(--gold);display:grid;place-items:center;font-weight:700;color:var(--gold);font-size:17px}
.me-card b{color:#fff;font-size:15px;display:block;line-height:1.25}
.me-card span{font-size:12px;color:var(--rail-dim)}
.nav h4{font-size:12px;font-weight:500;color:var(--rail-dim);margin:16px 10px 5px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;color:var(--rail-fg);text-decoration:none;font-size:14px}
.nav a:hover{background:var(--rail-2)}
.nav a.on{background:var(--rail-2);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.nav a svg{width:16px;height:16px;flex:none;opacity:.7}
.nav a.on svg{opacity:1;color:var(--gold)}
.nav .ct{margin-left:auto;font-size:11.5px;font-weight:600;border-radius:9px;padding:0 7px;line-height:18px}
.nav .ct.g{background:var(--gold);color:#1c1400}.nav .ct.a{background:rgba(169,156,255,.2);color:#b9aeff}
.nav .st{margin-left:auto;font-size:12px;color:var(--rail-dim);display:flex;align-items:center;gap:6px}
.rail .env{margin-top:auto;padding:11px 12px;border-radius:10px;background:var(--rail-2);font-size:12.5px;line-height:1.6}
.rail .env b{color:#fff;font-weight:600}
.rail .env .clk{color:var(--rail-dim)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block;flex:none}
.dot.u{background:#2dc98e}.dot.d{background:var(--danger)}.dot.w{background:var(--warn)}.dot.g{background:var(--gold)}.dot.a{background:var(--agent)}

/* 外框：上方列 */
.main{flex:1 1 0;min-width:0}
.bar{position:sticky;top:0;z-index:15;height:56px;display:flex;align-items:center;gap:10px;padding:0 28px;background:var(--canvas);border-bottom:1px solid var(--line)}
.bar .q{font-size:15.5px;font-weight:600;margin-right:auto;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--pane);border-radius:7px;padding:5px 11px;font-size:13px;white-space:nowrap}
button.chip:hover{border-color:var(--fg)}
.chip.mine{border-color:var(--gold-line);background:var(--gold-soft);color:var(--gold-ink);font-weight:500}
.kill{background:var(--danger);color:#fff;border:0;border-radius:7px;padding:8px 14px 8px 12px;font-weight:600;display:flex;gap:8px;align-items:center;white-space:nowrap}
.kill i{width:10px;height:10px;background:#fff;border-radius:2px;display:block}
.kill:hover{filter:brightness(1.08)}
.kill.locked{background:var(--pane);color:var(--danger);box-shadow:inset 0 0 0 1.5px var(--danger)}
.kill.locked i{background:var(--danger)}
.pop{position:absolute;right:28px;top:50px;width:380px;background:var(--pane);border:1px solid var(--line2);border-radius:10px;box-shadow:0 16px 44px rgba(10,14,20,.22);padding:16px;z-index:30}
.pop h3{margin:0 0 4px;font-size:14px}
.pop .it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--grid);font-size:13px}
.lock{margin:16px 28px 0;max-width:1680px;border:1.5px solid var(--danger);background:var(--danger-soft);border-radius:10px;padding:12px 16px;display:flex;justify-content:space-between;gap:16px;align-items:center}

/* 內容 */
.view{padding:22px 28px 56px;display:flex;flex-direction:column;gap:var(--gap);max-width:1680px}
.ans{display:flex;gap:28px;align-items:center}
.ans>div:first-child{flex:1 1 0;min-width:0}
.ans h1{font:400 30px/1.4 var(--kai);margin:0;letter-spacing:.01em;text-wrap:balance}
.ans h1 .n{font-weight:600}
.ans p{margin:8px 0 0;color:var(--dim);font-size:14.5px;max-width:44em}
.row{display:flex;gap:var(--gap);align-items:stretch}
.row>*{flex:1 1 0;min-width:0}
.col{display:flex;flex-direction:column;gap:var(--gap);min-width:0}
.pane{background:var(--pane);border:1px solid var(--line);border-radius:10px;padding:var(--pad);min-width:0}
.pane>h2{font-size:13.5px;font-weight:600;margin:0 0 12px;display:flex;align-items:center;gap:8px;line-height:1.4}
.pane>h2 .sp{margin-left:auto;display:flex;gap:6px;align-items:center;font-weight:400}
.pane.mine{border-color:var(--gold-line)}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:5px;padding:1px 7px;font-size:12px;font-weight:500;background:var(--grid);color:var(--dim);white-space:nowrap;line-height:1.6}
.tag.u{background:var(--up-soft);color:var(--up)}.tag.d{background:var(--down-soft);color:var(--down)}.tag.w{background:var(--warn-soft);color:var(--warn)}
.tag.g{background:var(--gold-soft);color:var(--gold-ink)}.tag.a{background:var(--agent-soft);color:var(--agent)}.tag.x{background:var(--danger-soft);color:var(--danger)}
/* 通過／沒過固定用綠紅，不跟著漲跌顏色的設定換 */
.tag.ok{background:var(--green-soft);color:var(--green)}.tag.no{background:var(--red-soft);color:var(--red)}
.okc{color:var(--green)}.badc{color:var(--red)}
[hidden]{display:none!important}
.yi{display:inline-flex;align-items:center;border:1px solid var(--gold-line);background:var(--gold-soft);color:var(--gold-ink);border-radius:4px;padding:0 5px;font-size:11.5px;font-weight:500;line-height:17px;vertical-align:middle;white-space:nowrap}
.yi:hover{background:var(--gold);color:#1c1400}
.btn{border:1px solid var(--line2);background:var(--pane);border-radius:7px;padding:6px 12px;white-space:nowrap;font-weight:500;font-size:13px}
.btn:hover:not(:disabled){border-color:var(--fg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.go{background:var(--gold);border-color:var(--gold);color:#1c1400;font-weight:600}
.btn.go:hover:not(:disabled){filter:brightness(1.06);border-color:var(--gold)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:600}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:none;color:var(--dim)}
.btn.ghost:hover:not(:disabled){border-color:var(--line2);color:var(--fg)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden;background:var(--pane)}
.seg button{border:0;background:none;padding:5px 11px;font-size:13px;color:var(--dim);white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--fg);color:var(--pane);font-weight:500}
.seg.sm button{padding:2px 9px;font-size:12.5px}
.sw{width:34px;height:20px;border-radius:10px;background:var(--line2);position:relative;border:0;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.sw.on{background:var(--gold)}.sw.on::after{transform:translateX(14px)}
.sw:disabled{opacity:.55;cursor:not-allowed}
table{width:100%;border-collapse:collapse}
th{font-weight:500;font-size:12.5px;color:var(--dim);text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--grid);font-size:13.5px;vertical-align:middle}
tr:last-child td{border-bottom:0}
th.r,td.r{text-align:right}th.c,td.c{text-align:center}
.kv{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid var(--grid);align-items:baseline}
.kv:last-child{border-bottom:0;padding-bottom:0}.kv:first-child{padding-top:0}
.big{font-size:26px;font-weight:600;line-height:1.15;letter-spacing:-.005em}

/* 離線還有多遠 */
.lim{padding:9px 0}.lim:first-of-type{padding-top:0}.lim:last-child{padding-bottom:0}
.lim .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.meter{position:relative;height:8px;border-radius:4px;background:var(--grid);margin:7px 0 20px}
.meter .fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;min-width:3px}
.meter .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);border-radius:1px}
.meter .tl{position:absolute;top:13px;font-size:12px;color:var(--dim);white-space:nowrap;transform:translateX(-50%)}
.meter .tl.e{transform:translateX(-100%)}

/* 待辦、清單 */
.todo{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--grid)}
.todo:last-child{border-bottom:0;padding-bottom:0}.todo:first-of-type{padding-top:2px}
.ev{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--grid);font-size:13.5px}
.ev:last-child{border-bottom:0;padding-bottom:0}
.ev .t{font-size:12.5px;color:var(--faint)}
.lg{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;gap:8px;align-items:center;font-size:13px;padding:4px 0}
.botrow{display:grid;grid-template-columns:minmax(150px,1.15fr) 62px minmax(0,1.6fr) 70px 76px 70px 82px;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--grid)}
.botrow:last-child{border-bottom:0;padding-bottom:0}
.botrow.hd{padding:0 0 7px;font-size:12.5px;color:var(--dim)}
a.botrow{text-decoration:none}a.botrow:hover .nm{text-decoration:underline}
.pipe{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0}
.pipe>div{padding:0 16px;border-left:1px solid var(--grid)}.pipe>div:first-child{padding-left:0;border-left:0}
.pipe .c{font-size:22px;font-weight:600;line-height:1.2}

/* 策略看板 */
.kan{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:start}
.kcol{background:var(--inset);border:1px solid var(--line);border-radius:10px;padding:10px}
.kcol .ct{display:flex;align-items:center;gap:8px;font-weight:600;padding:2px 3px}
.kcol .ct b{font-size:12.5px;background:var(--pane);border:1px solid var(--line);border-radius:999px;padding:0 8px;font-weight:600}
.kcol .sub{font-size:12.5px;color:var(--dim);padding:2px 3px 0;min-height:40px}
.kc{background:var(--pane);border:1px solid var(--line);border-radius:8px;padding:11px;margin-top:8px;display:block;text-decoration:none;cursor:pointer}
.kc:hover{border-color:var(--fg)}
.kc .nm{font-weight:600;font-size:14px;line-height:1.35}
.gb{display:flex;gap:3px;margin:9px 0 5px}.gb i{flex:1;height:5px;border-radius:2px;background:var(--grid)}
.gb i.p{background:var(--green)}.gb i.f{background:var(--red)}.gb i.r{background:var(--agent)}.gb i.a{background:var(--warn)}
.fit{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:12.5px;display:flex;gap:6px;align-items:flex-start;line-height:1.45}
.by{width:20px;height:20px;border-radius:5px;display:inline-grid;place-items:center;font-size:11.5px;font-weight:700;flex:none}
.by.you{background:var(--gold);color:#1c1400}.by.agt{border:1.5px solid var(--agent);color:var(--agent)}.by.q{border:1.5px dashed var(--agent);color:var(--agent)}
.ghost-c{border:1.5px dashed var(--line2);border-radius:8px;padding:14px 10px;font-size:12.5px;color:var(--dim);text-align:center;margin-top:8px}
.gm td.c{font-size:14px;font-weight:700;padding:9px 4px}
.gm .p{color:var(--green)}.gm .f{color:var(--red)}.gm .r{color:var(--agent)}.gm .a{color:var(--warn)}.gm .w{color:var(--faint)}

/* 研究 */
.tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tabs .btn.on{background:var(--fg);color:var(--pane);border-color:var(--fg)}
.verdict{border-left:4px solid var(--warn);padding:2px 0 2px 18px}
.verdict.p{border-color:var(--green)}.verdict.f{border-color:var(--red)}.verdict.r{border-color:var(--agent)}
.verdict h1{font:400 28px/1.4 var(--kai);margin:0}
.verdict p{margin:6px 0 0;font-size:14.5px;max-width:48em}
.chk{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--grid);font-size:13.5px}
.chk:last-child{border-bottom:0;padding-bottom:0}
.chk .m{font-weight:700;text-align:center}
.six{display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.six>div{padding:0 16px;border-left:1px solid var(--grid)}.six>div:first-child{padding-left:0;border-left:0}
.six .l{font-size:12.5px;color:var(--dim);display:flex;gap:6px;align-items:center;min-height:20px}
.six .v{font-size:22px;font-weight:600;line-height:1.3}
.cost{display:grid;grid-template-columns:64px minmax(0,1fr) 78px;gap:10px;align-items:center;padding:6px 0;font-size:13.5px}
.cost .bar2{height:12px;background:var(--grid);border-radius:3px;position:relative}.cost .bar2 i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.heat{display:grid;grid-template-columns:40px repeat(12,minmax(0,1fr));gap:3px;font-size:12px}
.heat .hm,.heat .hy{color:var(--dim);text-align:center;align-self:center}
.heat .hc{text-align:center;padding:5px 0;border-radius:3px}
.leg{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--dim);align-items:center}
.leg i{display:inline-block;width:16px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px}

/* 執行 */
.botcard{display:block;text-decoration:none;background:var(--pane);border:1px solid var(--line);border-radius:10px;padding:13px 14px}
.botcard:hover{border-color:var(--line2)}
.botcard.on{border-color:var(--fg);box-shadow:inset 3px 0 0 var(--gold)}
.say{background:var(--inset);border-radius:8px;padding:11px 14px;font:400 16.5px/1.55 var(--kai)}

/* 風控 */
.ladder{position:relative;height:66px;margin:6px 0 2px}
.ladder .z{position:absolute;top:22px;height:14px}
.ladder .mk{position:absolute;top:14px;height:30px;width:2px;background:var(--fg)}
.ladder .lb{position:absolute;top:46px;font-size:12.5px;white-space:nowrap}
.ladder .now{position:absolute;top:0;font-size:12.5px;font-weight:600;white-space:nowrap}
.bigkill{width:100%;padding:15px;border-radius:9px;border:0;background:var(--danger);color:#fff;font-size:16px;font-weight:700}
.bigkill:hover{filter:brightness(1.08)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 0}
.two>div{border:1px solid var(--line);border-radius:8px;padding:11px 12px;font-size:13px}
.two b{display:block;margin-bottom:2px;font-size:14px}

/* 個人 */
.portrait{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:22px;align-items:center}
.portrait .ava{width:76px;height:76px;font-size:34px;border-width:3px;background:var(--rail)}
.portrait h1{font:400 23px/1.6 var(--kai);margin:0;max-width:34em}
.mk-grid{display:grid;grid-template-columns:86px repeat(4,minmax(0,1fr));gap:4px;font-size:13px}
.mk-grid .h{color:var(--dim);font-size:12.5px;text-align:center;padding-bottom:2px}
.mk-grid .rw{align-self:center;font-weight:600}
.mk-grid button{border:1px solid var(--line);background:var(--inset);border-radius:6px;padding:7px 4px;font-size:12.5px;color:var(--faint);line-height:1.35;min-height:50px}
.mk-grid button.v2{background:var(--gold);border-color:var(--gold);color:#1c1400;font-weight:600}
.mk-grid button.v1{background:var(--gold-soft);border-color:var(--gold-line);color:var(--gold-ink)}
.mk-grid button small{display:block;font-weight:400;font-size:11.5px;opacity:.85}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:66px}
.wk div{background:var(--gold);border-radius:3px 3px 0 0;min-height:3px}
.wkl{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:12.5px;color:var(--dim);margin-top:4px}
.mem{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:14px;padding:15px 0;border-bottom:1px solid var(--grid);align-items:start}
.mem:last-child{border-bottom:0}
.mem .st{font:400 17px/1.5 var(--kai)}

  soft:{h:'一天虧到多少，停止加倉',u:'%',st:.5,mn:1,mx:()=>ME.hard-1,risk:1,imp:v=>`＝ 今天虧到 ${f(DB.acct.dayStart*v/100)} USDT 就停止加倉。`},
  hard:{h:'一天虧到多少，全部平倉並鎖住',u:'%',st:1,mn:()=>ME.soft+1,mx:20,risk:1,imp:v=>`＝ 今天虧到 ${f(DB.acct.dayStart*v/100)} USDT 就全部平倉。`}
};
function stdN(k,v){const o=ME[k];ME[k]=v;const [n,l]=stdOk();ME[k]=o;return `有回測的 ${l} 個策略裡，${n} 個完全合你的標準。`}
function dlgEdit(k){const e=ED[k];ST.ed={k,v:ME[k]};
  dlg(`<h3>${e.h}</h3><div class="step"><button data-act="st" data-d="-1" aria-label="調低">−</button><b id="sv"></b><button data-act="st" data-d="1" aria-label="調高">＋</button></div>
  <p id="simp" class="dim" style="text-align:center"></p><p id="swarn" class="warn s" style="text-align:center;min-height:20px"></p>
  <div class="acts"><button class="btn" data-act="close">不改了</button><button class="btn go" id="sgo" data-act="st-save">存起來</button></div>`);updEdit()}
function updEdit(){const {k,v}=ST.ed,e=ED[k];$('#sv').textContent=(k==='expo'?v.toFixed(2):v)+e.u;$('#simp').textContent=e.imp(v);
  $('#swarn').textContent=v===ME[k]||!e.risk?'':v>ME[k]?'這是放寬。這條線是你冷靜的時候定的，想清楚再存。':'這是收緊，存了馬上生效。';$('#sgo').disabled=v===ME[k]}
function dlgQuiet(){const op=s=>Array.from({length:48},(_,i)=>`<option value="${i/2}" ${i/2===s?'selected':''}>${hm(i/2)}</option>`).join('');
  dlg(`<h3>勿擾時段</h3><p>這段時間只有緊急停止、日虧線、帳本對不上會通知你。其他的留到摘要。</p>
  <div style="display:flex;gap:12px"><label class="f" style="flex:1">從<select id="qa" class="field">${op(Q.a)}</select></label><label class="f" style="flex:1">到<select id="qb" class="field">${op(Q.b)}</select></label></div>
  <div class="acts"><button class="btn" data-act="close">不改了</button><button class="btn go" data-act="quiet-save">存起來</button></div>`)}
function dlgMem(m){ST.me=m.id;dlg(`<h3>改這一條</h3><p class="dim">照你的話寫就好。Agent 會用新的這句。</p><textarea id="met" rows="3">${esc(mt(m))}</textarea>
  <div class="acts"><button class="btn" data-act="close">不改了</button><button class="btn go" data-act="mem-save">存起來</button></div>`)}
function dlgIdea(){dlg(`<h3>寫下新想法</h3><p class="agentsay">一句話就好。之後交給我研究，我會照你的規矩：只用 1 小時以上的 K 線，回測扣掉全部成本。</p>
  <label class="f">你的想法<input type="text" id="idt" placeholder="例如：BTC 連跌三天之後買進"></label>
  <div class="acts"><button class="btn" data-act="close">先不要</button><button class="btn go" data-act="idea-go">記下來</button></div>`)}
function dlgAgent(id){const s=DB.S(id);ST.ag=id;const on=RULES.filter(r=>r.kind==='ask'&&r.on&&[8,10,11].includes(r.id));
  dlg(`<h3>把「${esc(s.name)}」交給 Agent 研究？</h3><p class="agentsay">我會照你交代的做${s.sym==='SOL'?'。SOL 不是你常做的幣，我只研究做多':''}。第一次回測跑完，放進你的下一次摘要。</p>
  ${on.map(r=>`<div class="chk"><b class="m gold">•</b><span>${esc(r.t())}</span><span class="dim s">你的指示</span></div>`).join('')}
  <div class="chk"><b class="m gold">•</b><span>用你的六條標準下結論</span><span class="dim s">你的底線</span></div>
  <div class="acts"><button class="btn" data-act="close">先不要</button><button class="btn go" data-act="agent-go">交給 Agent 研究</button></div>`)}

/* ============ 外框、路由、動作 ============ */
const PAGES={
  overview:['總覽','現在安全嗎？賺還是賠？',vOverview],strategies:['策略','我的想法各走到哪？',vStrategies],research:['研究','這個想法值得上線嗎？',vResearch],
  exec:['執行','Bot 現在在做什麼？和回測一樣嗎？',vExec],risk:['風控','出事會怎樣？怎麼停？',vRisk],
  me:['我的檔案','這套系統懂我嗎？',vMe],memory:['Agent 記得的事','Agent 記得我什麼？說對了嗎？',vMemory],rules:['指示與界線','Agent 什麼能做、什麼不能做？',vRules],prefs:['版面與提醒','我要看什麼？什麼時候叫我？',vPrefs]
};
const NAV=[['交易',['overview','strategies','research','exec','risk']],['關於你',['me','memory','rules','prefs']]];
const IC={
  overview:'<path d="M2 10.5a6 6 0 0 1 12 0M8 10.5l3-3.5"/>',strategies:'<path d="M3 3v10M8 3v6M13 3v8"/>',research:'<circle cx="7" cy="7" r="4"/><path d="M10 10l3.5 3.5"/>',
  exec:'<path d="M1.5 8h3l2-4 3 8 2-4h3"/>',risk:'<path d="M8 1.8l5 2v3.7c0 3-2.1 5.4-5 6.7-2.9-1.3-5-3.7-5-6.7V3.8z"/>',
  me:'<circle cx="8" cy="5.5" r="2.5"/><path d="M3 13.5c.6-2.6 2.6-4 5-4s4.4 1.4 5 4"/>',memory:'<path d="M4 2h8v12l-4-3-4 3z"/>',
  rules:'<path d="M2 4h12M2 8h12M2 12h12M5 4v4M11 4v4M8 8v4"/>',prefs:'<path d="M2 5h12M2 11h12"/><circle cx="6" cy="5" r="1.8" fill="currentColor"/><circle cx="10" cy="11" r="1.8" fill="currentColor"/>'
};
let CURP='overview';
function applyPrefs(){const h=nowS()/3600%24,r=document.documentElement;r.dataset.theme=P.theme==='auto'?(h>=6&&h<18?'day':'night'):P.theme;r.dataset.color=P.color;r.dataset.density=P.density;r.dataset.tone=P.tone}
function renderRail(){const p=CURP,A=acct(),k=ST.kill,pc=MEM.filter(isPend).length;
  const ex={overview:DB.todo.length?`<span class="ct g" title="需要你決定">${DB.todo.length}</span>`:'',exec:`<span class="st"><span class="dot ${A.run?'u':'d'}"></span>${A.run} 個在跑</span>`,risk:`<span class="st"><span class="dot ${k?'d':'u'}"></span>${k?'鎖定中':'正常'}</span>`,memory:pc?`<span class="ct a" title="等你確認">${pc}</span>`:''};
  $('#rail').innerHTML=`<a class="brand" href="#overview"><span class="mk"><svg viewBox="0 0 20 20" width="20" height="20"><path d="M3 3.5l4 3h6l4-3v8.2a7 7 0 0 1-14 0z" fill="#1c1400"/></svg></span><span><b>CatOS</b><small>你的交易作業系統</small></span></a>
  <a class="me-card ${p==='me'?'on':''}" href="#me"><div class="ava">${ME.name[0]}</div><div><b>${ME.name}</b><span>模擬盤第 ${DB.acct.days} 天</span></div></a>
  <nav class="nav" aria-label="主選單">${NAV.map(([g,ids])=>`<h4>${g}</h4>${ids.map(id=>`<a href="#${id}" class="${p===id?'on':''}" ${p===id?'aria-current="page"':''}><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${IC[id]}</svg>${PAGES[id][0]}${ex[id]||''}</a>`).join('')}`).join('')}</nav>
  <div class="env"><div><span class="dot u" style="margin-right:7px"></span><b>OKX 模擬盤</b>　已連線</div><div class="clk">11/16 星期一　<span id="clk">${hms(nowS())}</span></div><div class="clk">實盤還沒開</div></div>`}
function renderBar(){const p=CURP,adj=ADJ[p],k=ST.kill,th=document.documentElement.dataset.theme;
  $('#bar').innerHTML=`<div class="q">${PAGES[p][1]}</div>
  ${adj?`<button class="chip mine" data-act="pop" aria-expanded="${!!ST.pop}">這一頁依你調整了 ${adj.length} 處</button>`:''}
  <span class="chip"><span class="dot u"></span>模擬盤</span>
  <button class="chip" data-act="theme" title="切換白天和夜晚">${th==='day'?'白天':'夜晚'}</button>
  ${k?`<button class="kill locked" data-act="unlock-open"><i></i>鎖定中，解除…</button>`:`<button class="kill" data-act="kill-open"><i></i>緊急停止</button>`}
  ${ST.pop&&adj?`<div class="pop" role="dialog" aria-label="這一頁依你調整的地方"><h3>這一頁依你調整了 ${adj.length} 處</h3><div class="dim s" style="margin-bottom:8px">畫面上金色的「依你」標記，就是這些地方。</div>${adj.map(a=>`<div class="it"><span>${adjT(a[0])}</span>${a[1]&&MEM.some(m=>m.id===a[1])?`<button class="btn sm" data-act="mem-go" data-id="${a[1]}">出處</button>`:`<a class="btn sm" href="#prefs" style="text-decoration:none">去設定</a>`}</div>`).join('')}</div>`:''}`}
function renderLock(){const k=ST.kill;$('#lock').innerHTML=k?`<div class="lock" role="alert"><div><b>已緊急停止，鎖定中。</b> 今天 ${k.t} 你按的，選「${k.ml}」。${k.q?`${k.q} 張 BTC 部位還留著，沒有 Bot 在管。`:'帳上沒有部位。'}現在不能下任何新單。</div><button class="btn danger" data-act="unlock-open" style="flex:none">解除鎖定…</button></div>`:''}
function render(){const pg=PAGES[CURP];applyPrefs();renderRail();renderBar();renderLock();$('#view').innerHTML=pg[2]();drawAll();document.title=pg[0]+'｜CatOS'}
function nav(p){if(!PAGES[p])return;CURP=p;ST.pop=false;try{if(location.hash.slice(1)!==p)location.hash=p}catch(e){}render();window.scrollTo(0,0)}

const ACT={
  pop(){ST.pop=!ST.pop;renderBar();return false},
  theme(){P.theme=document.documentElement.dataset.theme==='day'?'night':'day'},
  set(d){P[d.k]=d.v},
  close(){closeDlg();return false},
  say(d){toast(d.m);return false},
  bot(d){ST.bot=d.id;nav('exec');return false},
  rs(d){ST.rs=d.id;nav('research');return false},
  'mem-go'(d){const id=+d.id;if(!id){nav('prefs');return false}ST.memHl=id;ST.memCat='全部';nav('memory');const el=$('#m'+id);if(el)el.scrollIntoView({block:'center'});return false},
  shelve(d){const s=DB.S(d.id),old={stage:s.stage,note:s.note,next:s.next};Object.assign(s,{stage:'idea',note:'你擱置了：扣掉成本後是虧的',next:'想重來，再交給 Agent'});toast(`已擱置「${s.name}」，放回「想法」那一欄。`,()=>Object.assign(s,old))},
  /* 停止與解除 */
  'kill-open'(d){dlgKill(d.bot);return false},
  'kill-go'(){const r=$('input[name=km]:checked'),mode=r?r.value:'keep',{bot,held}=ST.kd,ml=!held?'全部停止':mode==='flat'?'平倉並停止':'保留部位只停止';
    if(bot){const nm=DB.S(bot).name;ST.stopped[bot]=mode;if(mode==='flat')ST.flat[bot]=1;DB.events.unshift([hhmm(),'you',`你停止了 ${nm}${held?`，選「${ml}」`:''}`]);toast(`已停止「${nm}」。${held?(mode==='flat'?'部位已經平掉。':'部位還留著。'):''}`)}
    else{if(mode==='flat')DB.bots.forEach(b=>ST.flat[b.id]=1);ST.kill={mode,q:mode==='keep'?held:0,t:hhmm(),ml};DB.events.unshift([hhmm(),'you',`你按了緊急停止，選「${ml}」`]);toast('已全部停止，系統鎖定中。')}
    closeDlg()},
  'unlock-open'(){dlgUnlock();return false},
  'unlock-go'(){const k=ST.kill,why=esc($('#ur').value.trim()||'沒有寫');DB.bots.forEach(b=>{ST.stopped[b.id]=ST.stopped[b.id]||k.mode});
    DB.latches.unshift([`11/16 ${k.t}`,`你按了緊急停止，選「${k.ml}」`,`11/16 ${hhmm()} 你手動解除。原因：${why}`]);DB.events.unshift([hhmm(),'you','你解除了鎖定。Bot 還停著']);ST.kill=null;closeDlg();toast('已解除鎖定。Bot 還停著，到「執行」重新啟動。')},
  'bot-start'(d){dlgStart(d.id);return false},
  'bot-start-go'(){const id=ST.bs;delete ST.stopped[id];DB.events.unshift([hhmm(),'you',`你重新啟動了 ${DB.S(id).name}`]);closeDlg();toast(`已重新啟動「${DB.S(id).name}」。`)},
  /* 部署、想法 */
  'deploy-open'(d){dlgDeploy(d.id);return false},
  dq(d){ST.dp.q=Math.min(5,Math.max(1,ST.dp.q+ +d.d));updDeploy();return false},
  'deploy-go'(){const {id,q}=ST.dp,s=DB.S(id);Object.assign(s,{stage:'demo',g:s.g.slice(0,4)+'rw',note:`剛部署，每次進場 ${q} 張`,next:'模擬盤要跑滿 30 天'});DB.pending.push(id);DB.todo=DB.todo.filter(t=>!(t.k==='deploy'&&t.id===id));
    DB.events.unshift([hhmm(),'you',`你把 ${s.name} 部署到模擬盤，每次進場 ${q} 張`]);closeDlg();toast(`已部署到模擬盤。下一根${TFN[s.tf]}收盤開始做決定。`)},
  'idea-new'(){dlgIdea();return false},
  'idea-go'(){const v=$('#idt').value.trim();if(!v){toast('先寫一句話。');return false}
    DB.strats.push({id:'n'+Date.now(),name:v.length>14?v.slice(0,14)+'…':v,desc:v,sym:'BTC',tf:'4H',stage:'idea',by:'你',g:'wwwwww',seed:91,note:'剛寫下，還只是一句話',next:'交給 Agent 研究'});closeDlg();toast('記下了，放在「想法」那一欄。')},
  'agent-open'(d){dlgAgent(d.id);return false},
  'agent-go'(){const s=DB.S(ST.ag);Object.assign(s,{stage:'research',g:'rwwwww',ret:null,_bt:null,note:'Agent 剛接手，還沒有結果',next:'等 Agent 跑完第一次回測'});DB.todo=DB.todo.filter(t=>!(t.k==='idea'&&t.id===s.id));closeDlg();toast(`已交給 Agent 研究「${s.name}」。`)},
  /* 我的底線、勿擾 */
  'me-edit'(d){if(d.k==='quiet')dlgQuiet();else dlgEdit(d.k);return false},
  st(d){const e=ED[ST.ed.k];ST.ed.v=Math.min(num(e.mx),Math.max(num(e.mn),Math.round((ST.ed.v+ +d.d*e.st)*100)/100));updEdit();return false},
  'st-save'(){const {k,v}=ST.ed,e=ED[k];ME[k]=v;closeDlg();toast(`已更新：${e.h}，${k==='expo'?v.toFixed(2):v}${e.u}。`)},
  'quiet-save'(){Q.a=+$('#qa').value;Q.b=+$('#qb').value;closeDlg();toast(`已更新：勿擾 ${qh()}。`)},
  /* Agent 記得的事 */
  'mem-cat'(d){ST.memCat=d.v},
  'mem-ok'(d){const m=MEM.find(x=>x.id==d.id);m.ok=1;m.ev+=`。今天 ${hhmm()} 你確認了`;m.use=m.id===13?[['提醒','prefs']]:[['風控','risk']];ST.memStamp=m.id;toast('記下了。'+m.then.replace('確認之後：',''))},
  'mem-no'(d){const i=MEM.findIndex(x=>x.id==d.id),m=MEM[i];MEM.splice(i,1);toast('好，我不會這樣假設。',()=>MEM.splice(i,0,m))},
  'mem-del'(d){const i=MEM.findIndex(x=>x.id==d.id),m=MEM[i];MEM.splice(i,1);toast('已忘掉。Agent 不會再用這一條。',()=>MEM.splice(i,0,m))},
  'mem-edit'(d){const m=MEM.find(x=>x.id==d.id);if(m.key)return ACT['me-edit']({k:m.key});dlgMem(m);return false},
  'mem-save'(){const m=MEM.find(x=>x.id===ST.me),v=$('#met').value.trim();if(!v){toast('不能是空的。要拿掉的話，按「忘掉」。');return false}m.t=v;m.ev=m.ev.replace(/。今天 [\d:]+ 你改過$/,'')+`。今天 ${hhmm()} 你改過`;ST.memHl=m.id;closeDlg();toast('已更新這一條。')},
  'mem-add'(){const v=$('#ma').value.trim();if(!v){toast('先寫一句話。');return false}const id=Date.now();MEM.unshift({id,cat:'你教的',src:'you',t:v,ev:`今天 ${hhmm()} 你寫的`,use:[]});ST.memCat='全部';ST.memHl=id;toast('記下了。')},
  /* 指示與界線 */
  'rule-ex'(d){return ACT['rule-try']({v:d.v})},
  'rule-try'(d){const txt=(d.v||($('#nr')||{}).value||'').trim();if(!txt){toast('先寫一句話。');return false}const p=PARSE[txt];ST.nr=txt;
    ST.draft=p?{...p}:{kind:'ask',t:txt,say:`我會把它當成做事的習慣：「${esc(txt)}」。我照著做，但系統不會強制擋下。`,hit:'這句話我還算不出會影響哪些 Bot。加進去之後，第一次用到時我會告訴你。'}},
  'rule-drop'(){ST.draft=null},
  'rule-add'(){const d=ST.draft;RULES.push({id:Date.now(),kind:d.kind,t:()=>d.t,how:d.kind==='wall'?d.say:'',last:'剛加上，還沒用到',hits:0,on:1,mine:1});ST.draft=null;ST.nr='';toast(d.kind==='wall'?'已加進界線，馬上生效。':'已加進指示，Agent 從現在開始照做。')},
  'rule-tog'(d){const r=RULES.find(x=>x.id==d.id);r.on=r.on?0:1},
  'rule-del'(d){const i=RULES.findIndex(x=>x.id==d.id),r=RULES[i];RULES.splice(i,1);toast('已刪掉這一條。',()=>RULES.splice(i,0,r))},
  auto(d){P.auto[d.k]=d.v},
  /* 版面與提醒 */
  blk(d){P.blocks[d.k]=P.blocks[d.k]?0:1},
  nt(d){P.notify[d.k]=d.v},
  mk(d){const r=P.mk[d.c];r[+d.i]=(r[+d.i]+1)%3}
};
document.addEventListener('click',e=>{
  if(ST.pop&&!e.target.closest('.pop')&&!e.target.closest('[data-act="pop"]')){ST.pop=false;renderBar()}
  const t=e.target.closest('[data-act]');
  if(t){if(t.tagName==='A')e.preventDefault();const fn=ACT[t.dataset.act];if(fn&&fn(t.dataset,t)!==false)render();return}
  const a=e.target.closest('a[href^="#"]');if(a){e.preventDefault();nav(a.getAttribute('href').slice(1))}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.name==='km'){const b=$('#kgo');b.disabled=false;b.textContent=t.value==='flat'?'平倉並停止':'保留部位只停止'}
  if(t.id==='dck')updDeploy();
  if(t.id==='uck')$('#ugo').disabled=!t.checked});
document.addEventListener('input',e=>{if(e.target.id==='nr')ST.nr=e.target.value});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('.ov'))closeDlg();else if(ST.pop){ST.pop=false;renderBar()}}
  if(e.key==='Enter'&&!e.isComposing){const t=e.target,run=a=>{if(ACT[a]({})!==false)render()};
    if(t.matches('[role=link]'))t.click();else if(t.id==='nr')run('rule-try');else if(t.id==='ma')run('mem-add');else if(t.id==='idt')run('idea-go')}
});
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(PAGES[h]&&h!==CURP)nav(h)});
const fitRail=()=>{$('#rail').style.height=Math.max(560,innerHeight)+'px'};fitRail();
let _rz;addEventListener('resize',()=>{fitRail();clearTimeout(_rz);_rz=setTimeout(drawAll,120)});
setInterval(()=>{$$('[data-cd]').forEach(el=>el.textContent=hms(el.dataset.cd-(nowS()-NOW0)));const c=$('#clk');if(c)c.textContent=hms(nowS())},1000);

/* 掛鉤（截圖、檢查用），要在這支程式之前設定：
   window.__PAGE='risk'      直接開到某一頁（也可以用網址 #risk）
   window.__THEME='night'    外觀：day 或 night
   window.__DENSITY='tight'  密度：roomy 或 tight
   window.__AFTER=api=>{…}   畫好之後執行。api.act('kill-open')、api.act('deploy-open',{id:'ens'})、api.go('memory') */
window.CatOS={go:nav,render,state:ST,prefs:P,act(a,d){if(ACT[a](d||{})!==false)render()}};
(function(){const h=location.hash.slice(1);CURP=PAGES[window.__PAGE]?window.__PAGE:PAGES[h]?h:'overview';
  if(window.__THEME)P.theme=window.__THEME;if(window.__DENSITY)P.density=window.__DENSITY;render();
  if(typeof window.__AFTER==='function')setTimeout(()=>{try{window.__AFTER(window.CatOS)}catch(err){console.error(err)}},80)})();


</script>
