<!doctype html>
<html lang="zh-Hant" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CatOS · 帳戶權益與損益 5 方案（零小卡片 · 日損安全墊版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --background: oklch(0.155 0.004 260);
  --foreground: oklch(0.94 0.004 260);
  --surface: oklch(0.19 0.004 260);
  --surface-raised: oklch(0.24 0.006 260);
  --gold: oklch(0.78 0.15 75);
  --primary: var(--gold);
  --muted-foreground: oklch(0.65 0.009 260);
  --up: oklch(0.78 0.15 165);
  --down: oklch(0.64 0.2 22);
  --warn: oklch(0.8 0.15 75);
  --border: oklch(0.42 0.009 260 / 38%);
  --hairline: oklch(0.42 0.009 260 / 28%);
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
  --font-sans: "Work Sans", "Noto Sans TC", "Microsoft JhengHei", ui-sans-serif, system-ui, sans-serif;

  /* 定案緊湊終端字級 10.5 / 11.5 / 12.5 / 13.5 */
  --t1: 10.5px;
  --t2: 11.5px;
  --t3: 12.5px;
  --t4: 13.5px;
  --card-h: 265px;
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--background); color: var(--foreground); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
body { padding-bottom: 78px; }

.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.c-up { color: #34d399; }
.c-down { color: #fb7185; }
.c-pri { color: var(--primary); }
.c-warn { color: #fbbf24; }
.c-muted { color: var(--muted-foreground); }

/* 頂部控制列 */
.topbar {
  position: sticky; top: 0; z-index: 40;
  background: color-mix(in oklab, var(--background) 93%, black);
  border-bottom: 1px solid var(--border); backdrop-filter: blur(8px);
  padding: 10px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
}
.topbar-title { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.topbar-title h1 { margin: 0; font-size: 15px; font-weight: 700; }
.topbar-title span { font: 500 11px var(--font-mono); color: var(--muted-foreground); }
.ctrl { display: flex; align-items: center; gap: 6px; }
.ctrl-l { font: 600 11px var(--font-mono); color: var(--muted-foreground); white-space: nowrap; }
.seg { display: inline-flex; gap: 2px; background: color-mix(in oklab, var(--surface) 80%, black); border: 1px solid var(--border); border-radius: 6px; padding: 2px; }
.seg button { border: 1px solid transparent; background: transparent; color: var(--muted-foreground); font: 500 11px var(--font-mono); padding: 4px 9px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
.seg button:hover { color: var(--foreground); background: rgb(255 255 255 / 0.04); }
.seg button[aria-pressed="true"] { background: color-mix(in oklab, var(--primary) 16%, transparent); border-color: color-mix(in oklab, var(--primary) 48%, transparent); color: var(--primary); font-weight: 600; }

.wrap { max-width: 1540px; margin: 0 auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 22px; }

.opt-box {
  border: 1px solid var(--border); border-radius: 8px;
  background: color-mix(in oklab, var(--surface) 32%, transparent);
  padding: 13px 15px 15px; display: flex; flex-direction: column; gap: 10px;
}
.opt-box.selected { border-color: color-mix(in oklab, var(--primary) 70%, transparent); background: color-mix(in oklab, var(--primary) 4%, var(--surface)); }
.opt-meta { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.opt-left { display: flex; flex-direction: column; gap: 3px; }
.opt-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.opt-key { font: 700 13px var(--font-mono); color: var(--primary); }
.opt-name { font-size: 14px; font-weight: 700; }
.opt-tag { font: 600 10.5px var(--font-mono); padding: 2px 7px; border-radius: 4px; border: 1px solid var(--border); color: var(--muted-foreground); }
.opt-tag.rec { color: #34d399; border-color: rgb(16 185 129 / 0.4); background: rgb(16 185 129 / 0.12); }
.opt-desc { font-size: 12px; color: var(--muted-foreground); line-height: 1.5; margin: 0; }
.pick-btn {
  font: 600 11.5px var(--font-mono); padding: 5px 12px; border-radius: 5px;
  border: 1px solid var(--border); background: color-mix(in oklab, var(--background) 75%, transparent);
  color: var(--foreground); cursor: pointer; white-space: nowrap; flex-shrink: 0;
}
.pick-btn:hover { border-color: var(--primary); color: var(--primary); }
.opt-box.selected .pick-btn { background: var(--primary); color: #000; border-color: var(--primary); }

/* 左右並排（左：候選權益卡 ｜ 右：已定案曝險額度方案 B） */
.pair-preview { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
@media (max-width: 1180px) { .pair-preview { grid-template-columns: 1fr; } }

/* 卡片外殼 */
.cat-card {
  background: color-mix(in oklab, var(--surface) 75%, var(--background));
  border: 1px solid var(--border); border-radius: 5px;
  display: flex; flex-direction: column; overflow: hidden; user-select: none;
  height: var(--card-h);
}
.cat-head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 0 12px; height: 36px; flex-shrink: 0;
  background: color-mix(in oklab, var(--surface-raised) 52%, transparent);
  border-bottom: 1px solid color-mix(in oklab, var(--border) 90%, transparent);
}
.cat-title-wrap { display: flex; align-items: center; gap: 7px; }
.cat-title { font-size: var(--t4); font-weight: 600; color: var(--foreground); }
.chip {
  font-family: var(--font-mono); font-size: var(--t1); font-weight: 600; line-height: 1;
  padding: 3px 6px; border-radius: 4px; border: 1px solid; display: inline-flex; align-items: center; gap: 5px;
}
.chip-ok { background: rgb(16 185 129 / 0.13); border-color: rgb(16 185 129 / 0.35); color: #34d399; }
.chip-muted { background: color-mix(in oklab, var(--background) 65%, transparent); border-color: var(--border); color: var(--muted-foreground); }
.dot { width: 6px; height: 6px; border-radius: 50%; background: #34d399; }
.cat-tabs { display: inline-flex; gap: 2px; background: color-mix(in oklab, var(--background) 70%, transparent); border: 1px solid var(--border); border-radius: 6px; padding: 2px; }
.cat-tabs span { font-family: var(--font-mono); font-size: var(--t2); padding: 2px 7px; border-radius: 4px; color: var(--muted-foreground); }
.cat-tabs span.active { background: color-mix(in oklab, var(--primary) 15%, transparent); border: 1px solid color-mix(in oklab, var(--primary) 45%, transparent); color: var(--primary); font-weight: 600; }

/* ==================== 共用無框元素（零嵌套小卡） ==================== */
.chart-col { flex: 1; min-width: 0; min-height: 0; padding: 9px 12px 8px; display: flex; flex-direction: column; position: relative; }
.chart-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; flex-shrink: 0; }
.stat-pills { display: flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: var(--t1); color: var(--muted-foreground); white-space: nowrap; }
.stat-pills b { font-weight: 600; }

/* 裸尺：日損風控安全墊（無外框盒，純精密刻度線） */
.cushion-bare { display: flex; flex-direction: column; gap: 4px; }
.cushion-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-size: var(--t1); }
.cushion-track { position: relative; height: 6px; border-radius: 2px; background: rgb(255 255 255 / 0.07); overflow: visible; }
.cushion-seg-hard { position: absolute; left: 0; width: 25%; top: 0; bottom: 0; background: rgb(244 63 94 / 0.34); border-radius: 2px 0 0 2px; }
.cushion-seg-soft { position: absolute; left: 25%; width: 25%; top: 0; bottom: 0; background: rgb(245 158 11 / 0.28); }
.cushion-seg-pos  { position: absolute; left: 50%; width: 6.4%; top: 0; bottom: 0; background: rgb(52 211 153 / 0.35); }
.cushion-tick { position: absolute; top: -2px; bottom: -2px; width: 1px; background: rgb(255 255 255 / 0.22); }
.cushion-tick.zero { background: rgb(255 255 255 / 0.55); }
.cushion-pin { position: absolute; top: -2px; bottom: -2px; left: 56.4%; width: 3px; border-radius: 1.5px; background: #34d399; transform: translateX(-50%); }
.cushion-scale { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 9.5px; color: var(--muted-foreground); line-height: 1; }

/* 純髮絲帳本列（無圓角、無底色、僅 1px 底線） */
.ledger-list { display: flex; flex-direction: column; }
.ledger-row {
  display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  padding: 5px 0; border-bottom: 1px solid var(--hairline);
}
.ledger-row:first-child { border-top: 1px solid var(--hairline); }
.ledger-row:last-child { border-bottom: 0; padding-bottom: 0; }
.ledger-row .k { font-size: var(--t2); color: var(--muted-foreground); white-space: nowrap; }
.ledger-row .v { font-family: var(--font-mono); font-size: var(--t3); font-weight: 600; white-space: nowrap; }
.ledger-row .sub { font-family: var(--font-mono); font-size: var(--t1); color: color-mix(in oklab, var(--muted-foreground) 72%, transparent); margin-left: 5px; font-weight: 400; }

/* 方案 1：雙欄髮絲帳本 */
.v1-body { flex: 1; min-height: 0; display: flex; }
.v1-left {
  width: 248px; flex-shrink: 0; border-right: 1px solid color-mix(in oklab, var(--border) 75%, transparent);
  background: color-mix(in oklab, var(--background) 22%, transparent);
  padding: 10px 13px; display: flex; flex-direction: column; justify-content: space-between; gap: 8px;
}

/* 方案 2：頂部髮絲數據帶 + 滿寬走勢圖 + 底部全寬安全墊 */
.v2-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.v2-strip {
  display: flex; align-items: center; justify-content: space-between; gap: 0;
  border-bottom: 1px solid color-mix(in oklab, var(--border) 72%, transparent);
  background: color-mix(in oklab, var(--background) 28%, transparent); flex-shrink: 0;
}
.v2-item {
  padding: 5px 11px; display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 0;
  border-right: 1px solid var(--hairline);
}
.v2-item.hero { flex: 1.85; }
.v2-item:last-child { border-right: 0; }
.v2-foot {
  padding: 5px 12px 6px; border-top: 1px solid color-mix(in oklab, var(--border) 72%, transparent);
  background: color-mix(in oklab, var(--background) 24%, transparent); flex-shrink: 0;
}

/* 方案 3：左欄緊湊帳本 + 右側雙圖（權益 + 水下回撤） */
.e-charts { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 3px; }

/* 方案 4：全寬無界畫布（左上裸字印記 + 底部一體收邊安全墊） */
.v4-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.v4-canvas { flex: 1; min-height: 0; position: relative; padding: 8px 12px 4px; display: flex; flex-direction: column; }
.v4-stamp {
  position: absolute; top: 8px; left: 14px; z-index: 4; pointer-events: none;
  display: flex; flex-direction: column; gap: 2px;
}
.v4-inline-kv { display: flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: var(--t1); color: var(--muted-foreground); flex-wrap: wrap; }
.v4-inline-kv b { font-weight: 600; }

/* 方案 5：左無框帳本 + 中走勢圖 + 右側垂直日損溫度計量表 */
.v5-body { flex: 1; min-height: 0; display: flex; }
.v5-gauge {
  width: 82px; flex-shrink: 0; border-left: 1px solid color-mix(in oklab, var(--border) 75%, transparent);
  background: color-mix(in oklab, var(--background) 24%, transparent);
  padding: 8px 8px; display: flex; flex-direction: column; align-items: stretch; justify-content: space-between; gap: 5px;
}
.vg-inner { flex: 1; min-height: 0; display: flex; align-items: stretch; justify-content: center; gap: 6px; padding: 2px 0; }
.vg-bar {
  position: relative; width: 9px; border-radius: 2px; background: rgb(255 255 255 / 0.07);
}
.vg-hard { position: absolute; left: 0; right: 0; bottom: 0; height: 25%; background: rgb(244 63 94 / 0.38); border-radius: 0 0 2px 2px; }
.vg-soft { position: absolute; left: 0; right: 0; bottom: 25%; height: 25%; background: rgb(245 158 11 / 0.30); }
.vg-pos  { position: absolute; left: 0; right: 0; bottom: 50%; height: 6.4%; background: rgb(52 211 153 / 0.45); }
.vg-zero { position: absolute; left: -2px; right: -2px; bottom: 50%; height: 1px; background: rgba(255,255,255,0.55); }
.vg-pin  { position: absolute; left: -3px; right: -3px; bottom: 56.4%; height: 3px; border-radius: 1.5px; background: #34d399; transform: translateY(50%); }
.vg-labels { display: flex; flex-direction: column; justify-content: space-between; font-family: var(--font-mono); font-size: 9.5px; line-height: 1; }

/* 右側已定案曝險額度方案 B 複製品 */
.exp-b-body { flex: 1; min-height: 0; display: flex; align-items: stretch; gap: 14px; padding: 8px 14px; }
.exp-kpi-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.exp-kpi { padding: 5px 9px; border-radius: 5px; background: color-mix(in oklab, var(--background) 62%, transparent); border: 1px solid color-mix(in oklab, var(--border) 75%, transparent); }
.exp-row { padding: 4px 8px; border-radius: 4px; border: 1px solid rgb(255 255 255 / 0.06); background: rgb(255 255 255 / 0.024); display: flex; flex-direction: column; gap: 3px; }
.exp-row.muted { background: transparent; border-color: rgb(255 255 255 / 0.04); }
.bar { height: 4px; border-radius: 99px; background: rgb(255 255 255 / 0.07); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; }

/* 底部定案條 */
.decision-bar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 60;
  background: color-mix(in oklab, var(--surface-raised) 94%, black);
  border-top: 1px solid color-mix(in oklab, var(--primary) 45%, var(--border));
  padding: 10px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
}
.decision-summary { font-family: var(--font-mono); font-size: 12px; color: var(--foreground); }
.decision-summary b { color: var(--primary); }
.copy-btn {
  font: 600 12px var(--font-mono); padding: 7px 14px; border-radius: 6px;
  border: 1px solid var(--primary); background: var(--primary); color: #000; cursor: pointer;
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-title">
    <h1>帳戶權益與損益 · 5 方案（零四格小卡片 · 融入日損風控安全墊）</h1>
    <span>純髮絲線與精密刻度 · 右側並排已定案「曝險額度 方案 B」</span>
  </div>

  <div class="ctrl">
    <span class="ctrl-l">卡片高度</span>
    <div class="seg" id="ctrl-h">
      <button data-h="232" aria-pressed="false">30% 矮 (232px)</button>
      <button data-h="265" aria-pressed="true">標準 (265px)</button>
      <button data-h="305" aria-pressed="false">高螢幕 (305px)</button>
    </div>
  </div>

  <div class="ctrl">
    <span class="ctrl-l">右軸單位</span>
    <div class="seg" id="ctrl-axis">
      <button data-axis="pct" aria-pressed="true">報酬 %</button>
      <button data-axis="usd" aria-pressed="false">金額 $</button>
    </div>
  </div>
</header>

<main class="wrap" id="app"></main>

<div class="decision-bar">
  <div class="decision-summary" id="decision-summary"></div>
  <button class="copy-btn" id="btn-copy" type="button">複製目前選擇回覆給 Agent</button>
</div>

<script>
const BASE_EQ = 10000;
const CURVE_PCT = [
  0, -0.1, -0.3, -0.5, -0.4, -0.3, -0.1, 0.2, 0.7, 1.3, 1.2, 1.1, 1.15, 0.8, 0.75, 0.82, 0.7, 0.55,
  0.65, 0.6, 0.52, 0.6, 0.65, 0.5, 0.9, 3.3, 2.8, 3.8, 3.6, 4.3, 3.7, 4.2, 4.0, 3.9, 4.1, 5.6,
  5.5, 6.2, 7.1, 8.6, 10.2, 10.0, 9.2, 10.1, 9.4, 9.5, 11.9, 10.8, 11.4, 10.2, 9.5, 10.6, 11.4, 11.7
];
const CURVE_DD = (() => {
  let peak = 100;
  return CURVE_PCT.map(p => {
    const val = 100 + p;
    if (val > peak) peak = val;
    return ((val - peak) / peak) * 100;
  });
})();

const state = { height: 265, axis: "pct", picked: "1" };

function fmtAxis(pct) {
  if (state.axis === "usd") {
    const usd = BASE_EQ * (1 + pct / 100);
    return "$" + (usd / 1000).toFixed(1) + "k";
  }
  return pct > 0 ? `+${pct}.0%` : `${pct}.0%`;
}

function buildMainSvg(opts = {}) {
  const { showPeak = false, withDrawdown = false, compactX = false, flatH = false } = opts;
  const W = flatH ? 640 : 460;
  const H = withDrawdown ? 112 : flatH ? 104 : 158;
  const plotW = flatH ? 584 : 406;
  const plotH = withDrawdown ? 102 : flatH ? 84 : 134;
  const lo = -1.5, hi = 13.5;
  const gx = (i) => (i / (CURVE_PCT.length - 1)) * plotW;
  const gy = (v) => 8 + ((hi - v) / (hi - lo)) * (plotH - 14);
  const pts = CURVE_PCT.map((v, i) => `${i === 0 ? "M" : "L"}${gx(i).toFixed(1)},${gy(v).toFixed(1)}`).join("");
  const zY = gy(0).toFixed(1);
  const area = `${pts}L${plotW},${zY}L0,${zY}Z`;
  const ticks = [0, 5, 10];
  const peakIdx = 46, lastIdx = CURVE_PCT.length - 1;

  const mainSvg = `
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;flex:${withDrawdown ? "1.8" : "1"};min-height:0;overflow:visible">
      <defs>
        <linearGradient id="eqGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#e8b45e" stop-opacity="0.23"/>
          <stop offset="100%" stop-color="#e8b45e" stop-opacity="0"/>
        </linearGradient>
      </defs>
      ${ticks.map(t => `
        <line x1="0" x2="${plotW}" y1="${gy(t).toFixed(1)}" y2="${gy(t).toFixed(1)}"
          stroke="${t === 0 ? "rgba(232,180,94,0.36)" : "rgba(255,255,255,0.10)"}" ${t === 0 ? "" : 'stroke-dasharray="3 3"'} stroke-width="${t === 0 ? 1 : 0.8}" />
        <text x="${plotW + 7}" y="${(gy(t) + 3.5).toFixed(1)}" font-family="var(--font-mono)" font-size="10.5"
          fill="${t === 0 ? "#e8b45e" : "#a1a1aa"}" font-weight="${t === 0 ? 600 : 400}">${fmtAxis(t)}</text>
      `).join("")}
      <path d="${area}" fill="url(#eqGrad)" />
      <path d="${pts}" fill="none" stroke="#e8b45e" stroke-width="1.85" stroke-linejoin="round" />
      <circle cx="${gx(lastIdx).toFixed(1)}" cy="${gy(CURVE_PCT[lastIdx]).toFixed(1)}" r="3.2" fill="#e8b45e" stroke="#18181b" stroke-width="1.5" />
      ${showPeak ? `
        <circle cx="${gx(peakIdx).toFixed(1)}" cy="${gy(CURVE_PCT[peakIdx]).toFixed(1)}" r="2.5" fill="#34d399" />
        <text x="${(gx(peakIdx) - 5).toFixed(1)}" y="${(gy(CURVE_PCT[peakIdx]) - 5).toFixed(1)}" text-anchor="end" font-family="var(--font-mono)" font-size="10" fill="#34d399" font-weight="600">高 +11.9%</text>
      ` : ""}
      ${!withDrawdown ? `
        <g font-family="var(--font-mono)" font-size="10.5" fill="#9ca3af">
          <text x="0" y="${H - 3}">10/24</text>
          ${!compactX ? `<text x="${(plotW * 0.25).toFixed(0)}" y="${H - 3}" text-anchor="middle">10/30</text>` : ""}
          <text x="${(plotW * 0.5).toFixed(0)}" y="${H - 3}" text-anchor="middle">11/05</text>
          ${!compactX ? `<text x="${(plotW * 0.75).toFixed(0)}" y="${H - 3}" text-anchor="middle">11/10</text>` : ""}
          <text x="${plotW}" y="${H - 3}" text-anchor="end">11/16</text>
        </g>
      ` : ""}
    </svg>
  `;

  if (!withDrawdown) return mainSvg;

  const ddH = 54, ddPlotH = 34, ddLo = -2.6;
  const ddy = (v) => 3 + ((0 - v) / (0 - ddLo)) * (ddPlotH - 5);
  const ddPts = CURVE_DD.map((v, i) => `${i === 0 ? "M" : "L"}${gx(i).toFixed(1)},${ddy(v).toFixed(1)}`).join("");
  const ddArea = `${ddPts}L${plotW},3L0,3Z`;
  const ddSvg = `
    <svg viewBox="0 0 ${W} ${ddH}" preserveAspectRatio="none" style="width:100%;flex:0.85;min-height:0;overflow:visible">
      <line x1="0" x2="${plotW}" y1="3" y2="3" stroke="rgba(255,255,255,0.16)" stroke-width="0.8"/>

    `;
  }).join("");
  updateBar();
}

document.getElementById("ctrl-h").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-h]");
  if (!btn) return;
  state.height = Number(btn.dataset.h);
  document.documentElement.style.setProperty("--card-h", state.height + "px");
  document.querySelectorAll("#ctrl-h button").forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
  render();
});

document.getElementById("ctrl-axis").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-axis]");
  if (!btn) return;
  state.axis = btn.dataset.axis;
  document.querySelectorAll("#ctrl-axis button").forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
  render();
});

document.addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-pick]");
  if (!btn) return;
  state.picked = btn.dataset.pick;
  render();
});

document.getElementById("btn-copy").addEventListener("click", (e) => {
  const text = e.target.dataset.copyText || "";
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text);
  const orig = e.target.textContent;
  e.target.textContent = "已複製，貼回對話即可";
  setTimeout(() => { e.target.textContent = orig; }, 1800);
});

render();
</script>
</body>
</html>
