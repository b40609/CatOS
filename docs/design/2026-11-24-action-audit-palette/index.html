<!doctype html>
<html lang="zh-Hant" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CatOS · 系統總覽 · 6 種風格呈現 × 分類配色 × 統一右上角切換按鈕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   100% 鎖定 CatOS globals.css 原生中性碳黑系統 Token（零偏藍、零異色）
   所有 6 套方案強制共用完全相同的卡片底色、標題列底色與邊框色
   ========================================================================= */
:root{
  --background: oklch(0.155 0.004 260);
  --foreground: oklch(0.94 0.004 260);
  --surface: oklch(0.19 0.004 260);
  --surface-raised: oklch(0.24 0.006 260);
  --muted-foreground: oklch(0.65 0.009 260);
  --faint-foreground: oklch(0.49 0.008 260);
  --border: oklch(0.42 0.009 260 / 38%);
  --border-soft: oklch(0.42 0.009 260 / 22%);
  --border-strong: oklch(0.48 0.009 260 / 55%);
  --gold: #e8b45e;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
  --sans: "Work Sans", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--background);color:var(--foreground);font:12px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.m{font-family:var(--mono);font-variant-numeric:tabular-nums}

.topbar{
  position:sticky;top:0;z-index:40;
  background:color-mix(in oklab, var(--background) 92%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  padding:10px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px}
.brand .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px rgba(232,180,94,.5)}
.ctrl-group{display:flex;align-items:center;gap:10px;margin-left:auto;flex-wrap:wrap}
.chk{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 10px;border-radius:5px;border:1px solid var(--border);
  background:var(--surface);font-family:var(--mono);font-size:11px;color:var(--foreground);cursor:pointer;user-select:none;
}
.chk input{accent-color:var(--gold);margin:0}

.wrap{max-width:1700px;margin:0 auto;padding:20px 24px 80px}
.intro{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.intro h1{margin:0;font-size:14.5px;font-weight:700}
.intro p{margin:0;font-size:11.5px;color:var(--muted-foreground)}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;align-items:start}
@media(max-width:1240px){.grid{grid-template-columns:1fr}}

.scheme-block{display:flex;flex-direction:column;gap:8px;min-width:0}
.scheme-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.scheme-title{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700}
.scheme-code{
  font-family:var(--mono);font-size:10.5px;font-weight:700;
  padding:2px 7px;border-radius:4px;background:rgba(232,180,94,.14);
  color:var(--gold);border:1px solid rgba(232,180,94,.36);
}
.scheme-desc{font-size:11px;color:var(--muted-foreground)}
.swatches{display:inline-flex;align-items:center;gap:4px}
.sw{width:11px;height:11px;border-radius:3px;border:1px solid rgba(255,255,255,.16)}

/* 卡片外殼與標題列：6 套完全一致，100% 原生 CatOS 底色 */
.card{
  background:color-mix(in oklab, var(--surface) 92%, transparent);
  border:1px solid var(--border);
  border-radius:6px;overflow:hidden;
  display:flex;flex-direction:column;min-width:0;
}
.card-h{
  height:38px;padding:0 12px;
  background:color-mix(in oklab, var(--surface-raised) 50%, var(--surface));
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.card-h-title{font-size:12px;font-weight:600;color:var(--foreground);white-space:nowrap}

.ev-subbar{
  padding:5px 12px;
  background:color-mix(in oklab, var(--background) 48%, transparent);
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border-soft);
  display:flex;align-items:center;justify-content:space-between;
  font-family:var(--mono);font-size:9.5px;color:var(--muted-foreground);
}
.ev-more{background:none;border:0;color:var(--gold);font-family:var(--mono);font-size:9.5px;padding:0;opacity:.88}
.ev-more:hover{opacity:1;text-decoration:underline}

/* =========================================================================
   6 套專屬「全總覽統一右上角切換按鈕」風格（同時套用於全 4 張總覽卡）
   ========================================================================= */

/* Tab 風格 1：底線光標式（Terminal Underline）— 零框線噪音，2px 蜂蜜金底線 */
.tabs-s1{
  display:inline-flex;align-items:stretch;gap:12px;height:100%;
}
.tabs-s1 button{
  position:relative;display:inline-flex;align-items:center;gap:4px;
  background:transparent;border:0;padding:0 2px;height:100%;
  font-family:var(--mono);font-size:10.5px;color:var(--muted-foreground);
  white-space:nowrap;transition:color .12s;
}
.tabs-s1 button:hover{color:var(--foreground)}
.tabs-s1 button.on{color:var(--foreground);font-weight:600}
.tabs-s1 button.on::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:2px;
  background:#e8b45e;border-radius:2px 2px 0 0;
}
.tabs-s1 button.alert-tab{color:#f59e0b}
.tabs-s1 button.crit-tab{color:#f43f5e;font-weight:600}
.tabs-s1 .t-dot{width:5px;height:5px;border-radius:50%;display:inline-block}
.tabs-s1 .t-dot.warn{background:#f59e0b}
.tabs-s1 .t-dot.crit{background:#f43f5e}

/* Tab 風格 2：霧藍微光膠囊（Soft Accent Pill）— 配合霧藍核准分流 */
.tabs-s2{
  display:inline-flex;align-items:center;gap:2px;padding:2px;
  background:color-mix(in oklab, var(--background) 68%, transparent);
  border:1px solid var(--border);border-radius:5px;
}
.tabs-s2 button{
  border:1px solid transparent;background:transparent;
  color:var(--muted-foreground);padding:2px 8px;border-radius:3.5px;
  font-family:var(--mono);font-size:10px;white-space:nowrap;transition:all .12s;
}
.tabs-s2 button:hover{color:var(--foreground);background:rgba(255,255,255,.04)}
.tabs-s2 button.on{
  background:rgba(127,174,226,.15);
  border-color:rgba(127,174,226,.42);
  color:#b8d4f2;font-weight:600;
}
.tabs-s2 button.alert-tab{color:#fbbf24}
.tabs-s2 button.crit-tab{color:#fda4af;font-weight:600}

/* Tab 風格 3：Linear 無框數標（Ghost Pill + Count Chip） */
.tabs-s3{
  display:inline-flex;align-items:center;gap:4px;
}
.tabs-s3 button{
  display:inline-flex;align-items:center;gap:4px;
  border:1px solid transparent;background:transparent;
  color:var(--muted-foreground);padding:3px 7px;border-radius:5px;
  font-family:var(--sans);font-size:10.5px;font-weight:500;white-space:nowrap;transition:all .12s;
}
.tabs-s3 button:hover{color:var(--foreground);background:rgba(255,255,255,.04)}
.tabs-s3 button.on{
  background:rgba(255,255,255,.09);color:var(--foreground);font-weight:600;
}
.tabs-s3 .cnt{
  font-family:var(--mono);font-size:9px;font-weight:600;
  padding:0 4px;border-radius:3px;line-height:1.45;
  background:rgba(255,255,255,.06);color:var(--muted-foreground);
}
.tabs-s3 button.on .cnt{background:rgba(232,180,94,.20);color:#e8b45e}
.tabs-s3 button.alert-tab .cnt{background:rgba(245,158,11,.18);color:#fbbf24}
.tabs-s3 button.crit-tab .cnt{background:rgba(244,63,94,.22);color:#fda4af}

/* Tab 風格 4：直角終端分割列（Sharp Segmented Bar）— 配合表格與霧青強調 */
.tabs-s4{
  display:inline-flex;align-items:center;
  background:color-mix(in oklab, var(--background) 72%, transparent);
  border:1px solid var(--border);border-radius:2px;overflow:hidden;
}
.tabs-s4 button{
  position:relative;border:0;border-right:1px solid var(--border-soft);
  background:transparent;color:var(--muted-foreground);
  padding:3.5px 8px;font-family:var(--mono);font-size:10px;white-space:nowrap;transition:all .12s;
}
.tabs-s4 button:last-child{border-right:0}
.tabs-s4 button:hover{color:var(--foreground);background:rgba(255,255,255,.03)}
.tabs-s4 button.on{
  background:color-mix(in oklab, var(--surface-raised) 85%, transparent);
  color:#8ad4c7;font-weight:600;
  box-shadow:inset 0 1.5px 0 #5eb5a6;
}
.tabs-s4 button.alert-tab{color:#e3b982}
.tabs-s4 button.crit-tab{color:#e498a2;font-weight:600}

/* Tab 風格 5：蜂蜜金立體膠囊（Gold-Trimmed Tactile Pill）— 原生 Noir & Gold 主題強化 */
.tabs-s5{
  display:inline-flex;align-items:center;gap:2px;padding:2px;
  background:color-mix(in oklab, var(--background) 72%, transparent);
  border:1px solid var(--border);border-radius:6px;
}
.tabs-s5 button{
  border:1px solid transparent;background:transparent;
  color:var(--muted-foreground);padding:2px 8px;border-radius:4px;
  font-family:var(--mono);font-size:10px;white-space:nowrap;transition:all .12s;
}
.tabs-s5 button:hover{color:var(--foreground);background:rgba(255,255,255,.04)}
.tabs-s5 button.on{
  background:rgba(232,180,94,.16);
  border-color:rgba(232,180,94,.42);
  color:#f3ca7d;font-weight:600;
  box-shadow:0 1px 3px rgba(0,0,0,.35);
}
.tabs-s5 button.alert-tab{color:#fbbf24}
.tabs-s5 button.crit-tab{color:#fb7185;font-weight:600}

/* Tab 風格 6：瑞士純白高對比膠囊（Swiss Monochrome Pill）— 與純白按鈕 100% 呼應 */
.tabs-s6{
  display:inline-flex;align-items:center;gap:4px;
}
.tabs-s6 button{
  border:1px solid transparent;background:transparent;
  color:var(--muted-foreground);padding:2.5px 9px;border-radius:99px;
  font-family:var(--mono);font-size:10px;white-space:nowrap;transition:all .12s;
}
.tabs-s6 button:hover{color:var(--foreground);border-color:var(--border)}
.tabs-s6 button.on{
  background:var(--foreground);color:#121316;border-color:var(--foreground);font-weight:700;
}
.tabs-s6 button.alert-tab{color:#fbbf24}
.tabs-s6 button.crit-tab{color:#fca5a5;font-weight:600}

/* 全總覽其餘 3 張卡右上角統一預覽帶 */
.sibling-strip{
  background:color-mix(in oklab, var(--surface) 78%, transparent);
  border:1px dashed var(--border);border-radius:6px;
  padding:7px 10px;display:flex;flex-direction:column;gap:6px;
}
.sibling-cap{
  font-family:var(--mono);font-size:9.5px;color:var(--faint-foreground);
  display:flex;align-items:center;justify-content:space-between;
}
.sibling-grid{display:flex;flex-direction:column;gap:5px}
.sibling-row{
  height:32px;padding:0 10px;border-radius:4px;
  background:color-mix(in oklab, var(--surface-raised) 44%, var(--surface));
  border:1px solid var(--border-soft);
  display:flex;align-items:center;justify-content:space-between;gap:8px;overflow:hidden;
}
.sibling-nm{font-size:11px;font-weight:600;color:oklch(0.84 0.005 260);white-space:nowrap}

/* =========================================================================
   風格 1：終端代碼欄（Bloomberg Code-Tag Grid）
   ========================================================================= */
.s1-row{
  display:grid;grid-template-columns:68px minmax(0,1fr) auto;gap:10px;align-items:center;
  padding:9px 12px;border-bottom:1px solid var(--border-soft);transition:background .1s;
}
.s1-row:last-child{border-bottom:0}
.s1-row:hover{background:rgba(255,255,255,.025)}
.s1-code{
  font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.03em;
  display:flex;flex-direction:column;line-height:1.25;padding-left:7px;border-left:2px solid transparent;
}
.s1-code small{font-size:8.5px;font-weight:500;opacity:.72}
.s1-code.p0{color:#f43f5e;border-left-color:#f43f5e}
.s1-code.p1{color:#f59e0b;border-left-color:#f59e0b}
.s1-code.p2{color:#e8b45e;border-left-color:#e8b45e}
.s1-code.p3{color:#8c8f98;border-left-color:#52525b}
.s1-body{min-width:0}
.s1-title{font-size:11.5px;font-weight:600;color:var(--foreground);display:flex;align-items:center;gap:8px;min-width:0}
.s1-title .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s1-kpi{font-family:var(--mono);font-size:10.5px;font-weight:700;flex:none}
.s1-kpi.p0{color:#fda4af}.s1-kpi.p1{color:#fbbf24}.s1-kpi.p2{color:#10b981}.s1-kpi.p3{color:#a1a1aa}
.s1-sub{font-size:10.5px;color:var(--muted-foreground);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s1-acts{display:flex;align-items:center;gap:10px;flex:none}
.s1-link{
  background:none;border:0;padding:2px 0;font-family:var(--mono);font-size:10px;
  color:var(--muted-foreground);border-bottom:1px solid transparent;transition:all .12s;
}
.s1-link:hover{color:var(--foreground);border-bottom-color:var(--muted-foreground)}
.s1-link.pri{color:#e8b45e;font-weight:600;border-bottom-color:rgba(232,180,94,.45)}
.s1-link.pri:hover{color:#f5cf86;border-bottom-color:#f5cf86}
.s1-link.danger{color:#fda4af;font-weight:600;border-bottom-color:rgba(244,63,94,.5)}
.s1-ev{
  display:grid;grid-template-columns:56px 42px minmax(0,1fr) auto;gap:8px;align-items:center;
  padding:6px 12px;border-bottom:1px solid rgba(255,255,255,.035);
  font-family:var(--mono);font-size:10px;background:color-mix(in oklab, var(--background) 30%, transparent);
}
.s1-ev:last-child{border-bottom:0}
.s1-ev:hover{background:rgba(255,255,255,.025)}
.s1-ev .tm{color:var(--faint-foreground);font-size:9.5px}
.s1-ev .cd{font-weight:700;font-size:9.5px}
.s1-ev .cd.risk{color:#94a3b8}.s1-ev .cd.warn{color:#f59e0b}.s1-ev .cd.buy{color:#34d399}.s1-ev .cd.sell{color:#fb7185}
.s1-ev .tx{color:oklch(0.84 0.005 260);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s1-ev .tx.al{color:var(--foreground);font-weight:500}
.s1-ev .rt{color:var(--muted-foreground);font-size:9.5px}

/* =========================================================================
   風格 2：結構化指標條 × 霧藍核准分流（Structured Metric Strip）
   ========================================================================= */
.s2-row{
  padding:10px 12px;border-bottom:1px solid var(--border-soft);
  display:flex;flex-direction:column;gap:6px;transition:background .12s;
  border-left:2px solid transparent;
}
.s2-row:last-child{border-bottom:0}
.s2-row:hover{background:rgba(255,255,255,.025)}
.s2-row.p0{border-left-color:#f43f5e;background:rgba(244,63,94,.04)}
.s2-row.p1{border-left-color:#f59e0b}
.s2-row.p2{border-left-color:#7faee2}
.s2-row.p3{border-left-color:#9d9ff5}
.s2-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.s2-head-l{display:flex;align-items:center;gap:7px;min-width:0}
.s2-tag{
  font-family:var(--mono);font-size:9.5px;font-weight:600;padding:2px 6px;border-radius:3px;flex:none;
}
.s2-tag.p0{background:rgba(244,63,94,.16);color:#fda4af}
.s2-tag.p1{background:rgba(245,158,11,.15);color:#fcd34d}
.s2-tag.p2{background:rgba(127,174,226,.16);color:#9fc5ee}
.s2-tag.p3{background:rgba(157,159,245,.15);color:#c4c6fa}
.s2-nm{font-size:11.5px;font-weight:600;color:var(--foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s2-sym{font-family:var(--mono);font-size:9.5px;color:var(--muted-foreground);background:rgba(255,255,255,.05);padding:1px 5px;border-radius:3px;flex:none}
.s2-metrics{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:5px 8px;border-radius:4px;
  background:color-mix(in oklab, var(--background) 48%, transparent);
  border:1px solid var(--border-soft);font-family:var(--mono);font-size:10px;
}
.s2-m{display:inline-flex;align-items:center;gap:4px;padding-right:8px;border-right:1px solid var(--border-soft)}
.s2-m:last-child{border-right:0;padding-right:0}
.s2-m span{color:var(--faint-foreground);font-size:9px}
.s2-m b{color:var(--foreground);font-weight:600}
.s2-m b.warn{color:#fbbf24}.s2-m b.up{color:#34d399}.s2-m b.down{color:#fb7185}.s2-m b.blue{color:#9fc5ee}
.s2-btn{
  padding:3px 8px;border-radius:4px;font-family:var(--mono);font-size:10px;
  border:1px solid var(--border-strong);background:color-mix(in oklab, var(--surface-raised) 55%, transparent);color:var(--foreground);
}
.s2-btn:hover{border-color:#7faee2;color:#9fc5ee}
.s2-btn.pri{border-color:rgba(127,174,226,.45);background:rgba(127,174,226,.14);color:#9fc5ee;font-weight:600}
.s2-btn.pri:hover{background:#7faee2;color:#111318}
.s2-btn.danger{border-color:rgba(244,63,94,.45);background:rgba(244,63,94,.14);color:#fda4af}
.s2-ev{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:6px 12px;border-bottom:1px solid rgba(255,255,255,.035);
  border-left:2px solid transparent;font-family:var(--mono);font-size:10px;
  background:color-mix(in oklab, var(--background) 28%, transparent);
}
.s2-ev:last-child{border-bottom:0}
.s2-ev.risk{border-left-color:#7faee2}.s2-ev.warn{border-left-color:#f59e0b}
.s2-ev.buy{border-left-color:#10b981}.s2-ev.sell{border-left-color:#f43f5e}
.s2-ev-l{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.s2-ev-l .tm{color:var(--faint-foreground);font-size:9.5px;flex:none}
.s2-ev-l .tx{color:oklch(0.84 0.005 260);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* =========================================================================
   風格 3：分組折疊佇列 × 垂直時間軸（Linear Grouped Queue）
   ========================================================================= */
.s3-grp-hd{
  padding:5px 12px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in oklab, var(--background) 42%, transparent);
  border-bottom:1px solid var(--border-soft);border-top:1px solid var(--border-soft);
  font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.03em;
}
.s3-grp-hd:first-child{border-top:0}
.s3-grp-hd.risk{color:#fb923c}.s3-grp-hd.crit{color:#f43f5e}.s3-grp-hd.appr{color:#e8b45e}.s3-grp-hd.prop{color:#94a3b8}
.s3-row{
  padding:8px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  border-bottom:1px solid rgba(255,255,255,.04);transition:background .1s;
}
.s3-row:last-child{border-bottom:0}
.s3-row:hover{background:rgba(255,255,255,.03)}
.s3-l{min-width:0;flex:1;display:flex;align-items:baseline;gap:8px}
.s3-nm{font-size:11.5px;font-weight:600;color:var(--foreground);white-space:nowrap}
.s3-fact{font-size:10.5px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s3-acts{display:flex;align-items:center;gap:6px;flex:none}
.s3-btn{
  padding:3px 8px;border-radius:4px;font-family:var(--mono);font-size:10px;
  border:1px solid var(--border);background:transparent;color:var(--muted-foreground);transition:all .12s;
}
.s3-btn:hover{border-color:var(--border-strong);color:var(--foreground);background:rgba(255,255,255,.04)}
.s3-btn.pri{background:#e8b45e;border-color:#e8b45e;color:#14120c;font-weight:700}

  el.style.display = 'block';
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => { el.style.display = 'none'; }, 2000);
}

function btnClick(b) {
  return `showToast('${b.copy ? '已複製 CLI 核准指令' : '前往：' + b.label}')`;
}

function renderTabStrip(schemeId, items, activeId, onClickExpr) {
  return `<div class="tabs-s${schemeId}">` + items.map(it => {
    const isOn = activeId === it.id;
    const cls = isOn ? 'on' : (it.tone || '');
    let inner = '';
    if (schemeId === '3') {
      inner = it.count !== undefined
        ? `<span>${it.text}</span><span class="cnt">${it.count}</span>`
        : `<span>${it.text}</span>`;
    } else if (schemeId === '1') {
      const dot = !isOn && it.tone === 'crit-tab' ? '<span class="t-dot crit"></span>'
        : !isOn && it.tone === 'alert-tab' ? '<span class="t-dot warn"></span>' : '';
      inner = `${dot}${it.text}${it.count !== undefined ? `(${it.count})` : ''}`;
    } else {
      inner = `${it.text}${it.count !== undefined ? `(${it.count})` : ''}`;
    }
    return `<button type="button" class="${cls}" onclick="${onClickExpr(it.id)}">${inner}</button>`;
  }).join('') + `</div>`;
}

function renderFeed(schemeId, evs, withHeader) {
  const hd = withHeader ? `
    <div class="ev-subbar">
      <span>近期審計與成交流水 · 225 筆</span>
      <button type="button" class="ev-more" onclick="setTab('${schemeId}','ALL')">展開全部 →</button>
    </div>` : '';

  if (schemeId === '1') {
    return hd + evs.map(e => `
      <div class="s1-ev">
        <span class="tm">${e.t}</span>
        <span class="cd ${e.type}">[${e.code}]</span>
        <span class="tx ${e.alert ? 'al' : ''}">${e.msg}</span>
        <span class="rt">${e.right}</span>
      </div>`).join('');
  }
  if (schemeId === '2') {
    return hd + evs.map(e => `
      <div class="s2-ev ${e.type}">
        <div class="s2-ev-l">
          <span class="tm">${e.t}</span>
          <span class="tx">${e.msg}</span>
        </div>
        ${e.right ? `<span class="m" style="color:var(--muted-foreground);font-size:9.5px">${e.right}</span>` : ''}
      </div>`).join('');
  }
  if (schemeId === '3') {
    return hd + `<div class="s3-tl">` + evs.map(e => `
      <div class="s3-tl-item">
        <span class="s3-tl-dot ${e.type}"></span>
        <div class="s3-tl-l">
          <span class="tm">${e.t}</span>
          <span class="tx">${e.msg}</span>
        </div>
        ${e.right ? `<span style="color:var(--muted-foreground);font-size:9.5px;flex:none">${e.right}</span>` : ''}
      </div>`).join('') + `</div>`;
  }
  if (schemeId === '4') {
    return hd + `<table class="s4-ev-tbl"><tbody>` + evs.map(e => `
      <tr>
        <td style="width:66px;color:var(--faint-foreground)">${e.t}</td>
        <td style="width:48px"><span class="s4-ev-tag ${e.type}">${e.label}</span></td>
        <td style="color:oklch(0.84 0.005 260);max-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e.msg}</td>
        <td style="width:116px;text-align:right;white-space:nowrap;color:var(--muted-foreground)">${e.right}</td>
      </tr>`).join('') + `</tbody></table>`;
  }
  if (schemeId === '5') {
    return hd + evs.map(e => `
      <div class="s5-ev">
        <div class="s5-ev-l">
          <span class="tm">${e.t}</span>
          <span class="mk ${e.type}">${e.mk}</span>
          <span class="tx">${e.msg}</span>
        </div>
        ${e.right ? `<span style="color:var(--muted-foreground);font-size:9.5px;flex:none">${e.right}</span>` : ''}
      </div>`).join('');
  }
  return hd + evs.map(e => `
    <div class="s6-ev">
      <div class="s6-ev-l">
        <span class="s6-dot ${e.type}"></span>
        <span class="tm">${e.t}</span>
        <span class="tx">${e.msg}</span>
      </div>
      ${e.right ? `<span style="color:var(--muted-foreground);font-size:9.5px;flex:none">${e.right}</span>` : ''}
    </div>`).join('');
}

function renderActions(schemeId, items) {
  if (schemeId === '1') {
    return items.map(it => `
      <div class="s1-row">
        <div class="s1-code ${it.sev}">${it.code} · ${it.en}<small>${it.tag}</small></div>
        <div class="s1-body">
          <div class="s1-title">
            <span class="nm">${it.name} · ${it.sym}</span>
            <span class="s1-kpi ${it.sev}">${it.kpi}</span>
          </div>
          <div class="s1-sub">${it.fact}</div>
        </div>
        <div class="s1-acts">
          ${it.btns.map(b => `<button type="button" class="s1-link ${b.cls}" onclick="${btnClick(b)}">${b.label} ${b.copy ? '⧉' : '↗'}</button>`).join('')}
        </div>
      </div>`).join('');
  }
  if (schemeId === '2') {
    return items.map(it => `
      <div class="s2-row ${it.sev}">
        <div class="s2-head">
          <div class="s2-head-l">
            <span class="s2-tag ${it.sev}">${it.tag}</span>
            <span class="s2-nm">${it.name}</span>
            <span class="s2-sym">${it.sym}</span>
          </div>
          <div style="display:flex;gap:5px;flex:none">
            ${it.btns.map(b => `<button type="button" class="s2-btn ${b.cls}" onclick="${btnClick(b)}">${b.label}</button>`).join('')}
          </div>
        </div>
        <div class="s2-metrics">
          ${it.metrics.map(m => `<span class="s2-m"><span>${m.k}</span><b class="${m.c}">${m.v}</b></span>`).join('')}
        </div>
      </div>`).join('');
  }
  if (schemeId === '3') {
    const groups = [];
    for (const it of items) {
      let g = groups.find(x => x.key === it.group);
      if (!g) { g = { key: it.group, label: it.groupLabel, items: [] }; groups.push(g); }
      g.items.push(it);
    }
    return groups.map(g => `
      <div class="s3-grp-hd ${g.key}">
        <span>${g.label}</span>
        <span>${g.items.length}</span>
      </div>
      ${g.items.map(it => `
        <div class="s3-row">
          <div class="s3-l">
            <span class="s3-nm">${it.name}</span>
            <span class="s3-fact">${it.sym} · ${it.fact}</span>
          </div>
          <div class="s3-acts">
            ${it.btns.map(b => `<button type="button" class="s3-btn ${b.cls}" onclick="${btnClick(b)}">${b.label}</button>`).join('')}
          </div>
        </div>`).join('')}
    `).join('');
  }
  if (schemeId === '4') {
    return `
      <table class="s4-tbl">
        <thead><tr>
          <th style="width:76px">分類</th>
          <th style="width:155px">策略 / 標的</th>
          <th>關鍵事實</th>
          <th style="width:168px;text-align:right">處置</th>
        </tr></thead>
        <tbody>
          ${items.map(it => `
            <tr>
              <td><span class="s4-pill ${it.sev}">${it.tag}</span></td>
              <td><div class="s4-strat">${it.name}<small>${it.sym}</small></div></td>
              <td><div class="s4-fact" title="${it.fact}">${it.fact}</div></td>
              <td class="s4-acts">
                ${it.btns.map(b => `<button type="button" class="s4-btn ${b.cls}" onclick="${btnClick(b)}">${b.label}</button>`).join('')}
              </td>
            </tr>`).join('')}
        </tbody>
      </table>`;
  }
  if (schemeId === '5') {
    return `<div class="s5-list">` + items.map(it => `
      <div class="s5-card ${it.sev}">
        <div class="s5-ico ${it.sev}">${it.icon}</div>
        <div class="s5-mid">
          <div class="s5-top">
            <span class="s5-cat ${it.sev}">${it.tag}</span>
            <span class="s5-nm">${it.name} · ${it.sym}</span>
          </div>
          <div class="s5-fact">${it.fact}</div>
        </div>
        <div class="s5-acts">
          ${it.btns.map(b => `<button type="button" class="s5-btn ${b.cls}" onclick="${btnClick(b)}">${b.label}</button>`).join('')}
        </div>
      </div>`).join('') + `</div>`;
  }
  return items.map((it, idx) => `
    <div class="s6-row">
      <div class="s6-num ${it.sev}">${String(idx + 1).padStart(2, '0')}</div>
      <div class="s6-mid">
        <div class="s6-top">
          <span class="s6-label ${it.sev}">${it.tag}</span>
          <span class="s6-nm">${it.name} · ${it.sym}</span>
        </div>
        <div class="s6-fact">${it.fact}</div>
      </div>
      <div class="s6-acts">
        ${it.btns.map(b => `<button type="button" class="s6-btn ${b.cls}" onclick="${btnClick(b)}">${b.label}</button>`).join('')}
      </div>
    </div>`).join('');
}

function renderAll() {
  const actions = state.p0 ? [P0_ITEM, ...BASE_ITEMS] : BASE_ITEMS;
  const grid = document.getElementById('grid');

  grid.innerHTML = SCHEMES.map(s => {
    const activeTab = state.tabs[s.id];
    const filteredEvents = activeTab === 'ALERT' ? EVENTS.filter(e => e.alert)
      : activeTab === 'ORDER' ? EVENTS.filter(e => e.type === 'buy' || e.type === 'sell')
      : activeTab === 'RISK' ? EVENTS.filter(e => e.type === 'risk')
      : EVENTS;

    const mainTabItems = [
      { id: 'ACTION', text: '待處理', count: actions.length, tone: state.p0 ? 'crit-tab' : 'alert-tab' },
      { id: 'ALL', text: '全部', count: 225 },
      { id: 'ALERT', text: '異常', count: 1, tone: 'alert-tab' },
      { id: 'ORDER', text: '成交', count: 10 },
      { id: 'RISK', text: '風控', count: 3 },
    ];
    const mainTabsHtml = renderTabStrip(s.id, mainTabItems, activeTab, id => `setTab('${s.id}','${id}')`);

    const bodyHtml = activeTab === 'ACTION'
      ? renderActions(s.id, actions) + (state.showFeed ? renderFeed(s.id, EVENTS, true) : '')
      : renderFeed(s.id, filteredEvents, false);

    const siblingsHtml = state.showSiblings ? `
      <div class="sibling-strip">
        <div class="sibling-cap">
          <span>全總覽其餘 3 張卡右上角同步統一效果</span>
          <span>${s.tabStyleLabel}</span>
        </div>
        <div class="sibling-grid">
          ${SIBLING_CARDS.map(card => `
            <div class="sibling-row">
              <span class="sibling-nm">${card.title}</span>
              ${renderTabStrip(s.id, card.items, state.sibTabs[s.id][card.key], id => `setSibTab('${s.id}','${card.key}','${id}')`)}
            </div>
          `).join('')}
        </div>
      </div>` : '';

    return `
      <section class="scheme-block">
        <div class="scheme-meta">
          <div class="scheme-title">
            <span class="scheme-code">${s.code}</span>
            <span>${s.name}</span>
          </div>
          <div class="swatches" title="分類色票">
            ${s.swatches.map(c => `<span class="sw" style="background:${c}"></span>`).join('')}
          </div>
        </div>
        <div class="scheme-desc">${s.desc}</div>
        <div class="card">
          <div class="card-h">
            <span class="card-h-title">待處理與事件審計</span>
            ${mainTabsHtml}
          </div>
          ${bodyHtml}
        </div>
        ${siblingsHtml}
      </section>
    `;
  }).join('');
}

window.setTab = (schemeId, tabId) => {
  state.tabs[schemeId] = tabId;
  renderAll();
};
window.setSibTab = (schemeId, cardKey, tabId) => {
  state.sibTabs[schemeId][cardKey] = tabId;
  renderAll();
};
document.getElementById('toggleP0').addEventListener('change', e => { state.p0 = e.target.checked; renderAll(); });
document.getElementById('toggleFeed').addEventListener('change', e => { state.showFeed = e.target.checked; renderAll(); });
document.getElementById('toggleSiblings').addEventListener('change', e => { state.showSiblings = e.target.checked; renderAll(); });

renderAll();
</script>
</body>
</html>
